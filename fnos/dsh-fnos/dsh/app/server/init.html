<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>正在初始化 DeepSeek Harness</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1a2233 0%, #0f1115 60%);
    color: #dbe2f0;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 32px 20px;
  }
  .logo { width: 84px; height: 84px; border-radius: 20px; margin-bottom: 20px; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
  .sub { font-size: 13px; color: #8b96ad; margin-bottom: 28px; text-align: center; }
  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 24px 28px;
    text-align: center;
    max-width: 420px;
    width: 100%;
  }
  .spinner {
    width: 34px; height: 34px; margin: 0 auto 16px;
    border: 3px solid rgba(255,255,255,0.12);
    border-top-color: #6d8dff;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { font-size: 15px; font-weight: 600; color: #9db4ff; margin-bottom: 10px; }
  .tip { font-size: 13px; color: #8b96ad; line-height: 1.8; margin-bottom: 6px; }
  .elapsed { font-size: 12px; color: #5a6478; }
  .btn {
    display: inline-block; margin-top: 16px; padding: 8px 26px;
    border-radius: 8px; background: #6d8dff; color: #fff;
    font-size: 13px; cursor: pointer; border: none; text-decoration: none;
  }
  .btn:hover { background: #5a7cf0; }
  .stages { display: flex; justify-content: center; gap: 6px; margin-bottom: 16px; }
  .stage {
    font-size: 11px; color: #5a6478;
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 20px; padding: 4px 12px;
    transition: all 0.3s;
  }
  .stage.active { color: #9db4ff; border-color: #6d8dff; background: rgba(109,141,255,0.12); }
  .stage.done { color: #5ad08a; border-color: rgba(90,208,138,0.4); }
  .progress { font-size: 12.5px; color: #8b96ad; margin-bottom: 8px; min-height: 18px; }
  .links { margin-top: 10px; font-size: 12px; }
  .links a { color: #6d8dff; text-decoration: none; margin: 0 6px; }
  .links a:hover { text-decoration: underline; }
</style>
</head>

  <h1>DeepSeek Harness</h1>
  <div class="sub">正在飞牛 NAS 上启动 DeepSeek AI 助手工作台</div>

  <div class="card">
    <div class="spinner"></div>
    <div class="status" id="status">正在初始化…</div>
    <div class="stages">
      <span class="stage active" data-stage="check">① 检查运行时</span>
      <span class="stage" data-stage="install">② 下载安装</span>
      <span class="stage" data-stage="start">③ 启动服务</span>
      <span class="stage" data-stage="ready">④ 就绪</span>
    </div>
    <div class="progress" id="progress"></div>
    <div class="tip" id="tip">首次启动需要下载 DSH 运行时（约几分钟）<br />请保持应用运行，就绪后本页将自动进入</div>
    <div class="elapsed" id="elapsed"></div>
    <button class="btn" id="btn" onclick="retry()">手动刷新</button>
    <div class="links"><a href="log" target="_blank">查看运行日志</a></div>
  </div>

  <script>
    var startedAt = Date.now();
    // API 根路径自愈（v0.2.1 复审 P0-1 修复）：init 在 /app/dsh 或 /app/dsh/ 打开，
    // 提取网关前缀（pathname 前两段）后拼接 /app/dsh/api/*；本地开发前缀为空
    function apiUrl(p) {
      var m = location.pathname.match(/^(\/[^/]+\/[^/]+)/);
      var base = m ? m[1] + '/' : '/';
      return base + p;
    }
    var STAGE_TEXT = {
      check: '正在检查 DSH 运行时…',
      install: '正在下载安装 DSH 运行时…',
      start: '正在启动 DSH 服务…',
      ready: '正在进入…'
    };
    function setStage(stage) {
      document.querySelectorAll('.stage').forEach(function (el) {
        var on = el.dataset.stage === stage;
        el.classList.toggle('active', on);
        var order = ['check', 'install', 'start', 'ready'];
        var idx = order.indexOf(stage);
        el.classList.toggle('done', idx > 0 && order.indexOf(el.dataset.stage) < idx);
      });
      var st = document.getElementById('status');
      if (STAGE_TEXT[stage]) st.textContent = STAGE_TEXT[stage];
      var prog = document.getElementById('progress');
      if (stage === 'install' && document._mb) {
        prog.textContent = '已下载 ' + document._mb + ' MB…';
      } else if (stage !== 'install') {
        prog.textContent = '';
      }
    }
    var failCount = 0;
    var timer = setInterval(function () {
      var sec = Math.round((Date.now() - startedAt) / 1000);
      document.getElementById('elapsed').textContent = '已等待 ' + sec + ' 秒';
      // 超 5 分钟提示可能异常（正常下载 3-8 分钟，异常时引导看日志）
      var slow = document.getElementById('slow');
      if (sec > 300 && !slow) {
        var tip = document.getElementById('tip');
        var d = document.createElement('div');
        d.id = 'slow';
        d.style.cssText = 'margin-top:8px;color:#e8c56a;font-size:12.5px;';
        d.textContent = '等待较久？下载可能较慢或网络异常，请查看运行日志确认进度。';
        tip.parentNode.insertBefore(d, tip.nextSibling);
      }
      fetch(apiUrl('api/status'), { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d) { failCount++; if (failCount > 5) showStatusFail(); return; }
          failCount = 0;
          if (d.error) {
            // 初始化失败：明确提示，不再无限等待
            clearInterval(timer);
            document.getElementById('status').textContent = '初始化失败';
            document.getElementById('tip').textContent = d.error;
            document.getElementById('progress').textContent = '';
            var btn = document.getElementById('btn');
            btn.textContent = '重试';
            document.getElementById('elapsed').textContent = '失败原因见运行日志';
            return;
          }
          if (d.progressMb) document._mb = d.progressMb;
          setStage(d.stage || 'check');
          if (d.dshReady) { clearInterval(timer); location.reload(); }
        })
        .catch(function () { failCount++; if (failCount > 5) showStatusFail(); });
    }, 2000);
    function showStatusFail() {
      clearInterval(timer);
      document.getElementById('status').textContent = '状态服务异常';
      document.getElementById('tip').textContent = '无法获取初始化状态（可能网关/服务异常），请查看运行日志或刷新页面重试。';
      document.getElementById('elapsed').textContent = '';
    }
    function retry() {
      // 失败重试：通知壳重新初始化（已就绪则等价于刷新）
      fetch(apiUrl('api/restart'), { method: 'POST', cache: 'no-store' })
        .catch(function () {})
        .then(function () { setTimeout(function () { location.reload(); }, 500); });
    }
  </script>
</body>
