<html lang="zh-CN">

<meta charset="UTF-8" />

<title>关于 DeepSeek Harness</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1a2233 0%, #0f1115 60%);
    color: #dbe2f0;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 32px 20px;
  }
  .logo { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 16px; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .sub { font-size: 13px; color: #8b96ad; margin-bottom: 24px; text-align: center; }
  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 24px;
    text-align: center;
    max-width: 380px;
    width: 100%;
  }
  .card img { width: 220px; height: 220px; border-radius: 10px; background: #fff; padding: 8px; margin-bottom: 14px; }
  .group-num { font-size: 20px; font-weight: 600; color: #9db4ff; margin-bottom: 8px; }
  .tip { font-size: 13px; color: #8b96ad; line-height: 1.7; margin-bottom: 4px; }
  .ver { font-size: 12px; color: #5a6478; margin-top: 20px; }
  .btn {
    display: inline-block; margin-top: 14px; padding: 9px 30px;
    border-radius: 8px; background: #6d8dff; color: #fff;
    font-size: 14px; cursor: pointer; border: none; text-decoration: none;
  }
  .btn:hover { background: #5a7cf0; }
  .update-card {
    margin-top: 22px; width: 100%; max-width: 380px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px; padding: 18px 22px; text-align: left;
  }
  .update-title { font-size: 14px; font-weight: 600; color: #dbe2f0; margin-bottom: 10px; }
  .update-row { font-size: 13px; color: #8b96ad; line-height: 1.9; }
  .update-row b { color: #dbe2f0; font-weight: 600; }
  .update-notes { font-size: 12.5px; color: #e8c56a; margin-top: 6px; min-height: 18px; }
  .update-status { font-size: 12.5px; color: #5ad08a; margin-top: 8px; min-height: 18px; }
  .update-err { color: #ff8d8d; }
  .btn-sm {
    display: inline-block; margin-top: 10px; padding: 7px 22px;
    border-radius: 8px; background: #6d8dff; color: #fff;
    font-size: 13px; cursor: pointer; border: none; text-decoration: none;
  }
  .btn-sm:hover { background: #5a7cf0; }
  .btn-sm:disabled { background: #3a4258; cursor: not-allowed; }
  .links { margin-top: 14px; font-size: 12px; text-align: center; }
  .links a { color: #6d8dff; text-decoration: none; margin: 0 6px; }
  .links a:hover { text-decoration: underline; }
</style>
</head>

    // API 在 /app/dsh/api/* —— 必须提取网关前缀（pathname 前两段），
    // 不能只去尾斜杠（旧写法会拼成 /app/dsh/about/api/* 全部 404）
    function apiUrl(p) {
      var m = location.pathname.match(/^(\/[^/]+\/[^/]+)/);
      var base = m ? m[1] + '/' : '/';
      return base + p;
    }
    // 同级页面导航（L1 修复：不用裸相对路径，防 /app/dsh/about/ 尾斜杠解析错位）
    function pageUrl(name) { return location.pathname.replace(/\/[^/]*\/?$/, '/') + name; }
    // M2（v0.2.1）：内页导航用 pageUrl 推导（网关前缀自适应），返回 DSH 指向网关根
    document.getElementById('lk-update').href = pageUrl('update');
    document.getElementById('lk-log').href = pageUrl('log');
    document.getElementById('lk-back').href = location.pathname.replace(/\/[^/]*\/?$/, '/');
    var upgrading = false;
    function setStatus(text, err) {
      var el = document.getElementById('up-status');
      el.textContent = text || '';
      el.className = 'update-status' + (err ? ' update-err' : '');
    }
    function checkUpdate() {
      var btn = document.getElementById('up-btn');
      btn.disabled = true;
      btn.textContent = '查询中…';
      fetch(apiUrl('api/update'), { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          btn.disabled = false;
          btn.textContent = '检查更新';
          if (!d || !d.dsh) { setStatus('查询失败（请检查网络）', true); return; }
          var cur = d.dsh.current || '未知';
          var lat = d.dsh.latest || '未知';
          document.getElementById('up-current').textContent = cur;
          document.getElementById('up-latest').textContent = lat;
          document.getElementById('up-notes').textContent = d.dsh.notes || '';
          if (d.dsh.latest && d.dsh.notes) {
            btn.textContent = '立即升级';
            btn.disabled = false;
            btn.onclick = upgradeDsh;
          } else {
            setStatus('');
          }
        })
        .catch(function () { btn.disabled = false; btn.textContent = '检查更新'; setStatus('查询失败（请检查网络）', true); });
    }
    function upgradeDsh() {
      if (upgrading) return;
      upgrading = true;
      var btn = document.getElementById('up-btn');
      btn.disabled = true;
      btn.textContent = '升级中…（需几分钟）';
      setStatus('正在升级 DSH 运行时，期间应用短暂不可用…');
      fetch(apiUrl('api/update/upgrade'), { method: 'POST', cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d && d.ok) {
            setStatus('升级完成：' + d.from + ' → ' + d.to);
            btn.textContent = '已是最新';
          } else {
            var msg = { 'fetch-failed': '无法连接更新源', 'no-update': '当前已是最新版本', 'write-failed': '改写配置失败', 'forbidden': '无权限：仅管理员可升级', 'busy': '升级正在进行中' }[d && d.reason] || '升级失败';
            setStatus(msg, true);
            btn.textContent = '重试';
            btn.disabled = false;
            btn.onclick = upgradeDsh;
          }
        })
        .catch(function () { setStatus('升级请求失败', true); btn.textContent = '重试'; btn.disabled = false; btn.onclick = upgradeDsh; })
        .finally(function () { upgrading = false; });
    }
    // 动态显示应用/DSH 版本（读 /api/health）
    fetch(apiUrl('api/health'), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.dshVersion) {
          // 服务地址 = 网关前缀（/app/dsh；本地开发直接访问时为 ''）
          var base = location.pathname.replace(/\/[^/]*\/?$/, '').replace(/\/?$/, '');
          document.getElementById('ver').textContent =
            'DeepSeek Harness for fnOS · v' + d.appVersion + ' · DSH ' + d.dshVersion + (base ? ' · ' + base : '');
        }
      })
      .catch(function () { /* 静默：保持默认文本 */ });
    checkUpdate(); // 打开页面自动查一次
    function copyNum() {
      const num = '916607090';
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(num).then(() => { alert('群号已复制：' + num); });
      } else {
        const ta = document.createElement('textarea');
        ta.value = num; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        alert('群号已复制：' + num);
      }
    }
  </script>
</body>
</html>
