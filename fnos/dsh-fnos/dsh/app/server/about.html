<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>关于 DeepSeek Harness</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1a2233 0%, #0f1115 60%);
    color: #dbe2f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  .logo { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 16px; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .sub { font-size: 13px; color: #8b96ad; margin-bottom: 24px; text-align: center; }
  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 24px;
    text-align: center;
    max-width: 380px;
    width: 100%;
  }
  .card img { width: 220px; height: 220px; border-radius: 10px; background: #fff; padding: 8px; margin-bottom: 14px; }
  .group-num { font-size: 20px; font-weight: 600; color: #9db4ff; margin-bottom: 8px; }
  .tip { font-size: 13px; color: #8b96ad; line-height: 1.7; margin-bottom: 4px; }
  .ver { font-size: 12px; color: #5a6478; margin-top: 20px; }
  .btn {
    display: inline-block; margin-top: 14px; padding: 9px 30px;
    border-radius: 8px; background: #6d8dff; color: #fff;
    font-size: 14px; cursor: pointer; border: none; text-decoration: none;
  }
  .btn:hover { background: #5a7cf0; }
</style>
</head>
<body>
  <img class="logo" src="qq-group.png" alt="" style="display:none" />
  <h1>DeepSeek Harness</h1>
  <div class="sub">在飞牛 NAS 上运行的 DeepSeek AI 助手工作台</div>

  <div class="card">
    <img src="qq-group.png" alt="QQ群二维码" />
    <div class="group-num">群号：916607090</div>
    <div class="tip">扫码或搜索群号加入用户交流群<br />问题反馈 · 功能建议 · 版本更新</div>
    <button class="btn" onclick="copyNum()">复制群号</button>
  </div>

  <div class="ver" id="ver">DeepSeek Harness for fnOS</div>

  <script>
    function copyNum() {
      const num = '916607090';
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(num).then(() => { alert('群号已复制：' + num); });
      } else {
        const ta = document.createElement('textarea');
        ta.value = num; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        alert('群号已复制：' + num);
      }
    }
  </script>
</body>
</html>
