<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; style-src 'self' file: 'unsafe-inline'; script-src 'self' file:; img-src 'self' file: data:" />
  <title>记忆管理</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    body {
      align-items: stretch;
      padding: 18px 20px 20px;
      height: 100vh;
      overflow: hidden; /* 滚动交给内部容器 */
      display: flex;
      flex-direction: column;
    }
    h1 { font-size: 18px; font-weight: 590; margin-bottom: 2px; }
    .subtitle { font-size: 12px; color: var(--text-quaternary); margin-bottom: 12px; line-height: 1.7; }
    .subtitle code { background: var(--bg-hover); padding: 1px 5px; border-radius: 4px; font-size: 11px; }
    /* v1.2.1：记忆管理双 Tab（全局记忆 / 项目记忆） */
    .tabs {
      display: flex; gap: 6px; margin-bottom: 14px; flex-shrink: 0;
      background: var(--bg-hover); padding: 4px; border-radius: var(--radius-btn);
    }
    .tabs .tab {
      flex: 1; padding: 8px 12px; border: none; border-radius: calc(var(--radius-btn) - 2px);
      background: transparent; cursor: pointer; font-size: 13px; font-weight: 590;
      color: var(--text-secondary); transition: background .15s ease, color .15s ease;
    }
    .tabs .tab:hover { color: var(--text-primary); }
    .tabs .tab.active { background: var(--bg-surface); color: var(--text-primary); box-shadow: 0 1px 4px rgba(0,0,0,.15); }
    .panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .panel[hidden] { display: none; }
    /* 项目记忆 Tab 2 */
    .pm-layout { display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; overflow-y: auto; }
    .pm-ws-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-secondary); }
    .pm-ws-row code { background: var(--bg-hover); padding: 3px 7px; border-radius: 5px; font-size: 11px; color: var(--text-primary); }
    .pm-ws-row .btn.ghost { padding: 5px 12px; font-size: 12px; }
    .pm-guide {
      font-size: 12.5px; line-height: 1.7; color: var(--warn);
      background: rgba(245,166,35,.08); border: 1px solid rgba(245,166,35,.3);
      border-radius: var(--radius-btn); padding: 10px 12px;
    }
    .pm-main { display: flex; gap: 12px; flex: 1; min-height: 0; }
    .pm-side { width: 210px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
    .pm-side-head { font-size: 12px; font-weight: 590; color: var(--text-secondary); margin: 2px 4px 0; }
    .pm-item {
      display: flex; align-items: center; gap: 7px; padding: 8px 10px;
      border-radius: var(--radius-btn); cursor: pointer; background: var(--bg-input);
      border: 1px solid var(--border-standard); color: var(--text-secondary); flex-shrink: 0;
    }
    .pm-item:hover { border-color: rgba(94,106,210,.5); }
    .pm-item.active { background: linear-gradient(90deg, rgba(124,120,255,0.16), rgba(124,120,255,0.04)); border-color: rgba(124,120,255,0.55); color: var(--text-primary); }
    .pm-item-name { font-size: 12.5px; font-weight: 590; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pm-item-date { font-size: 10px; color: var(--text-quaternary); flex-shrink: 0; }
    /* v1.2.3：项目记忆三栏 —— 中栏「区块导航」+ 右栏「内容编辑」（复用全局记忆 memo-* 样式） */
    .pm-navcol { width: 200px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    #pm-nav { width: 100%; padding-right: 2px; }
    /* v1.2.5：项目记忆「区块导航」栏两个添加按钮，统一实底样式（与全局记忆一致、比面板背景显眼） */
    .pm-navcol .pm-add-nav-btn {
      align-self: stretch; display: flex; align-items: center; justify-content: center;
      padding: 10px 14px; font-size: 13px; font-weight: 700;
      background: rgba(124,120,255,.12); border-color: rgba(124,120,255,.5); color: var(--text-primary);
    }
    .pm-navcol .pm-add-nav-btn:hover { background: rgba(124,120,255,.2); }
    .pm-editor { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
    .pm-editor { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; background: var(--bg-input); border: 1px solid var(--border-standard); border-radius: var(--radius-btn); padding: 12px 14px; }
    .pm-head-input { width: 100%; min-height: 44px; resize: vertical; box-sizing: border-box; padding: 8px 11px; background: var(--bg-input); border: 1px solid var(--border-standard); border-radius: var(--radius-btn); color: var(--text-primary); font: 12.5px/1.6 Consolas, "Courier New", "Microsoft YaHei", monospace; outline: none; white-space: pre-wrap; }
    .pm-head-input:focus { border-color: rgba(94,106,210,.55); }
    .pm-sec { display: flex; flex-direction: column; gap: 5px; background: var(--bg-input); border: 1px solid var(--border-standard); border-radius: var(--radius-btn); padding: 8px 10px; }
    .pm-sec-head { display: flex; align-items: center; gap: 6px; }
    .pm-sec-head .hash { font: 600 14px Consolas, monospace; color: var(--brand); }
    .pm-sec-title { flex: 1; padding: 6px 9px; font-size: 13px; font-weight: 590; background: var(--bg-input); border: 1px solid var(--border-standard); border-radius: 8px; color: var(--text-primary); outline: none; }
    .pm-sec-title:focus { border-color: rgba(94,106,210,.55); }
    .pm-sec-body { width: 100%; min-height: 76px; resize: vertical; box-sizing: border-box; padding: 8px 10px; background: var(--bg-input); border: 1px solid var(--border-standard); border-radius: 8px; color: var(--text-primary); font: 12.5px/1.6 Consolas, "Courier New", "Microsoft YaHei", monospace; outline: none; white-space: pre; }
    .pm-sec-body:focus { border-color: rgba(94,106,210,.55); }
    .pm-sec .del { width: 26px; height: 26px; flex-shrink: 0; border: none; background: transparent; cursor: pointer; color: var(--text-quaternary); font-size: 14px; border-radius: 6px; }
    .pm-sec .del:hover { color: #ff6b6b; background: rgba(255,107,107,.12); }
    .pm-empty { font-size: 12.5px; color: var(--text-quaternary); padding: 18px 4px; text-align: center; }
    .pm-add { align-self: flex-start; padding: 7px 14px; border: 1px dashed var(--border-standard); border-radius: var(--radius-btn); background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 12.5px; font-weight: 590; }
    .pm-add:hover { color: var(--brand); border-color: rgba(94,106,210,.55); background: var(--bg-hover); }
    .pm-foot { display: flex; align-items: center; gap: 10px; }
    .pm-foot .spacer { flex: 1; }
    /* 反馈横幅 */
    .banner {
      display: none; padding: 9px 14px; margin-bottom: 12px;
      border-radius: var(--radius-btn); font-size: 13px; font-weight: 590;
    }
    .banner.show { display: block; }
    .banner.ok { color: var(--success); background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.3); }
    .banner.fail { color: var(--warn); background: rgba(245,166,35,.1); border: 1px solid rgba(245,166,35,.3); }
    /* v1.0.5（用户反馈 4）：解析异常恢复提示条（一键从 .bak 恢复） */
    .corrupt-bar {
      display: none; align-items: center; gap: 10px; margin-bottom: 12px;
      padding: 9px 14px; border-radius: var(--radius-btn); font-size: 12.5px; line-height: 1.6;
      color: #e5484d; background: rgba(229,72,77,.08); border: 1px solid rgba(229,72,77,.35);
    }
    .corrupt-bar.show { display: flex; }
    .corrupt-bar span { flex: 1; }
    .corrupt-bar .restore-bak {
      padding: 6px 14px; border: none; border-radius: var(--radius-btn); cursor: pointer;
      font-size: 12.5px; font-weight: 590; background: #e5484d; color: #fff; flex-shrink: 0;
    }
    .corrupt-bar .restore-bak:hover { background: #d63b40; }
    .corrupt-bar .restore-bak:disabled { opacity: .5; cursor: default; }
    /* 左右分栏（参考提示词库） */
    .layout { display: flex; gap: 16px; flex: 1; min-height: 0; }
    .left {
      width: 220px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px;
      overflow-y: auto; align-content: flex-start;
    }
    .cat {
      padding: 10px 12px; border-radius: var(--radius-btn); cursor: pointer;
      font-size: 13px; color: var(--text-secondary);
      background: transparent; border: 1px solid transparent;
      display: flex; align-items: center; gap: 6px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .cat:hover { background: var(--bg-hover); }
    .cat.active { background: linear-gradient(90deg, rgba(124,120,255,0.14), rgba(124,120,255,0.04)); border-color: rgba(124,120,255,0.4); color: var(--text-primary); }
    .cat .tag {
      font-size: 10.5px; color: var(--text-quaternary); flex-shrink: 0;
      background: var(--bg-hover); border-radius: 999px; padding: 1px 7px;
    }
    .cat .sec-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .cat-add {
      margin-top: 6px; padding: 9px 12px; border: 1px dashed var(--border-standard);
      border-radius: var(--radius-btn); background: transparent; color: var(--text-secondary);
      cursor: pointer; font-size: 13px; font-weight: 590; text-align: center;
    }
    .cat-add:hover { color: var(--brand); border-color: rgba(94,106,210,.55); background: var(--bg-hover); }
    .right {
      flex: 1; min-width: 0; display: flex; flex-direction: column;
      background: var(--bg-surface);
      background: color-mix(in srgb, var(--bg-surface) 74%, transparent);
      backdrop-filter: blur(14px) saturate(1.3);
      -webkit-backdrop-filter: blur(14px) saturate(1.3);
      border: 1px solid var(--border-standard); border-top-color: var(--border-strong);
      border-radius: var(--radius-card); padding: 14px 16px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .right-head { font-size: 14px; font-weight: 590; color: var(--text-primary); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .right-head .tag {
      font-size: 10.5px; font-weight: 400; color: var(--text-quaternary);
      background: var(--bg-hover); border-radius: 999px; padding: 1px 8px;
    }
    /* 基础设定字段列表 */
    .fields { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }
    .row {
      display: flex; gap: 10px; align-items: stretch;
      background: var(--bg-input); border: 1px solid var(--border-standard);
      border-radius: var(--radius-btn); padding: 8px 10px;
    }
    .row .f-name {
      width: 148px; flex-shrink: 0; padding: 8px 10px;
      background: var(--bg-input); border: 1px solid var(--border-standard);
      border-radius: 8px; color: var(--text-primary);
      font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; outline: none;
    }
    .row .f-value {
      flex: 1; min-width: 0; padding: 8px 10px; min-height: 36px; resize: vertical;
      background: var(--bg-input); border: 1px solid var(--border-standard);
      border-radius: 8px; color: var(--text-primary);
      font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; outline: none;
    }
    .row .f-name:focus, .row .f-value:focus { border-color: rgba(94,106,210,.55); }
    .row .f-name::placeholder, .row .f-value::placeholder { color: var(--text-quaternary); }
    /* 默认角色下拉选择（v0.9.13） */
    .row .f-select {
      min-height: 36px; cursor: pointer; appearance: auto;
      font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .row .del {
      width: 30px; flex-shrink: 0; border: none; background: transparent; cursor: pointer;
      color: var(--text-quaternary); font-size: 15px; border-radius: 8px;
    }
    .row .del:hover { color: #ff6b6b; background: rgba(255,107,107,.12); }
    .add-field {
      padding: 8px 14px; border: 1px dashed var(--border-standard); border-radius: var(--radius-btn);
      background: transparent; color: var(--text-secondary); cursor: pointer;
      font-size: 13px; font-weight: 590; align-self: flex-start;
    }
    .add-field:hover { color: var(--brand); border-color: rgba(94,106,210,.55); background: var(--bg-hover); }
    /* v1.2.3（用户指令 2）：「＋ 添加子区块」更醒目 —— 全宽、居中、略高，排在子区块汇总之后 */
    .add-sub-btn {
      align-self: stretch; display: flex; align-items: center; justify-content: center;
      padding: 11px 14px; font-size: 13px; font-weight: 700; margin-top: 2px;
    }
    .add-sub-btn:hover { color: var(--brand); border-color: rgba(94,106,210,.55); background: rgba(124,120,255,.1); }
    /* 基础设定内的子组标签（你的信息 / 角色设定） */
    .group-label {
      font-size: 12.5px; font-weight: 590; color: var(--text-secondary);
      margin: 4px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border-standard);
    }
    .group-label.role { margin-top: 14px; color: var(--brand); }
    .group-label .hint { font-weight: 400; color: var(--text-quaternary); margin-left: 8px; font-size: 11px; }
    /* 未配置引导提示条 */
    .guide-tip {
      font-size: 12px; line-height: 1.7; color: var(--warn);
      background: rgba(245,166,35,.08); border: 1px solid rgba(245,166,35,.3);
      border-radius: var(--radius-btn); padding: 8px 12px; margin-bottom: 10px;
    }
    /* v0.9.15（用户指令）：双击对话框选择角色提示（红色字体） */
    .tip-red {
      font-size: 12.5px; line-height: 1.7; font-weight: 590; color: #e5484d;
      background: rgba(229,72,77,.08); border: 1px solid rgba(229,72,77,.35);
      border-radius: var(--radius-btn); padding: 8px 12px; margin-bottom: 10px;
    }
    /* v0.9.16（用户指令）：标题后红色标注（DSH 视角），提醒配置角色别搞成用户视角 */
    .dsh-view {
      color: #e5484d; font-size: 13px; font-weight: 590;
      margin-left: 2px;
    }
    /* v1.2.3（用户指令）：全局记忆区块 —— 左侧区块列表 + 右侧编辑（对齐 DSH 角色，去掉卡片弹跳） */
    .memo-layout { display: flex; gap: 12px; flex: 1; min-height: 0; }
    .memo-list {
      width: 210px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px;
      overflow-y: auto; align-content: flex-start; padding-right: 2px;
    }
    .memo-item {
      display: flex; align-items: center; gap: 7px;
      padding: 9px 10px; border-radius: var(--radius-btn); cursor: pointer;
      background: var(--bg-input); border: 1px solid var(--border-standard);
      color: var(--text-secondary); flex-shrink: 0;
    }
    .memo-item:hover { border-color: rgba(94,106,210,.5); }
    .memo-item.active { background: linear-gradient(90deg, rgba(124,120,255,0.16), rgba(124,120,255,0.04)); border-color: rgba(124,120,255,0.55); color: var(--text-primary); }
    .memo-item-icon { font: 600 12px Consolas, "Courier New", monospace; color: var(--text-quaternary); flex-shrink: 0; }
    .memo-item-name { font-size: 12.5px; font-weight: 590; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .memo-item .del { width: 22px; height: 22px; flex-shrink: 0; border: none; background: transparent; cursor: pointer; color: var(--text-quaternary); font-size: 12px; border-radius: 6px; }
    .memo-item .del:hover { color: #ff6b6b; background: rgba(255,107,107,.12); }
    /* v1.2.5（用户指令）：添加按钮放进左栏、竖着排（对齐项目记忆）—— 左栏 = 列表 + 两个添加按钮 */
    .memo-left { width: 210px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
    #memo-list { flex: 1; min-height: 0; width: 100%; }
    .memo-addbar { display: flex; flex-direction: column; gap: 6px; }
    .memo-addbar .add-sec-btn,
    .memo-addbar #btn-add-sec {
      align-self: stretch; display: flex; align-items: center; justify-content: center;
      padding: 10px 14px; font-size: 13px; font-weight: 700;
      background: rgba(124,120,255,.12); border-color: rgba(124,120,255,.5); color: var(--text-primary);
    }
    .memo-addbar .add-field:hover { background: rgba(124,120,255,.2); }
    /* v1.2.3：## 组头 + 缩进 ### 子项 */
    .memo-group {
      display: flex; align-items: center; gap: 7px;
      padding: 9px 10px; margin-top: 2px; border-radius: var(--radius-btn);
      cursor: pointer; color: var(--text-secondary); font-weight: 590;
      background: transparent; border: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }
    .memo-group:hover { border-color: rgba(94,106,210,.5); }
    .memo-group.active { background: linear-gradient(90deg, rgba(124,120,255,0.16), rgba(124,120,255,0.04)); border-color: rgba(124,120,255,0.55); color: var(--text-primary); }
    .memo-group-name { font-size: 12.5px; font-weight: 590; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .memo-sub {
      display: flex; align-items: center; gap: 7px;
      padding: 6px 10px 6px 24px; margin-left: 14px;
      border-left: 2px solid var(--border-subtle);
      border-radius: calc(var(--radius-btn) - 2px);
      cursor: pointer; color: var(--text-secondary); flex-shrink: 0;
    }
    .memo-sub:hover { background: var(--bg-hover); }
    .memo-sub.active { background: linear-gradient(90deg, rgba(124,120,255,0.14), rgba(124,120,255,0.03)); color: var(--text-primary); }
    .memo-sub-icon { color: var(--brand); opacity: .85; }
    .memo-sub-name { font-size: 12px; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .memo-group .del, .memo-sub .del { width: 22px; height: 22px; flex-shrink: 0; border: none; background: transparent; cursor: pointer; color: var(--text-quaternary); font-size: 12px; border-radius: 6px; }
    .memo-group .del:hover, .memo-sub .del:hover { color: #ff6b6b; background: rgba(255,107,107,.12); }
    .memo-editor {
      flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px;
      background: var(--bg-input); border: 1px solid var(--border-standard);
      border-radius: var(--radius-btn); padding: 12px 14px; overflow-y: auto;
    }
    .memo-editor-head { display: flex; align-items: center; gap: 8px; }
    .memo-editor-head .hash { font: 600 15px Consolas, monospace; color: var(--brand); }
    .memo-editor-field { display: flex; flex-direction: column; gap: 5px; flex: 1 1 auto; min-height: auto; }
    .memo-editor-title {
      flex: 1; min-width: 0; padding: 8px 11px; font-size: 13.5px; font-weight: 590;
      font-family: Consolas, "Courier New", "Microsoft YaHei", sans-serif;
      background: var(--bg-input); border: 1px solid var(--border-standard);
      border-radius: 8px; color: var(--text-primary); outline: none;
    }
    .memo-editor-title:focus { border-color: rgba(94,106,210,.55); }
    .memo-editor .del { width: 26px; height: 26px; flex-shrink: 0; border: none; background: transparent; cursor: pointer; color: var(--text-quaternary); font-size: 14px; border-radius: 6px; }
    .memo-editor .del:hover { color: #ff6b6b; background: rgba(255,107,107,.12); }
    .memo-editor-label { font-size: 12px; font-weight: 590; color: var(--brand); font-family: Consolas, "Courier New", "Microsoft YaHei", monospace; }
    .memo-editor-label .hint { font-weight: 400; color: var(--text-quaternary); margin-left: 6px; font-family: inherit; font-size: 11px; }
    /* v1.2.3（用户修复）：「区块内容」带删除按钮时，标签行右侧放 ✕（删除前言、不删子区块） */
    .memo-editor-label.with-del { display: flex; align-items: center; gap: 6px; }
    .memo-editor-label .intro-del {
      width: 20px; height: 20px; flex-shrink: 0; margin-left: auto;
      border: none; background: transparent; cursor: pointer;
      color: var(--text-quaternary); font-size: 12px; border-radius: 6px;
    }
    .memo-editor-label .intro-del:hover { color: #ff6b6b; background: rgba(255,107,107,.12); }
    .memo-editor-body {
      flex: 1; min-height: 200px; resize: vertical; width: 100%; box-sizing: border-box;
      padding: 10px 12px;
      background: var(--bg-input); border: 1px solid var(--border-standard);
      border-radius: var(--radius-btn); color: var(--text-primary); outline: none;
      font: 12.5px/1.7 Consolas, "Courier New", "Microsoft YaHei", monospace;
      white-space: pre;
    }
    .memo-editor-body:focus { border-color: rgba(94,106,210,.55); }
    /* v1.2.3（用户修复）：## 组头面板 —— 有子区块时压缩空前言框，避免「大空框」观感 */
    .memo-editor-body.compact { min-height: 64px; }
    /* v1.2.3（用户修复）：## 组头面板 —— 本区块全部内容（只读子区块汇总，解决点 ## 显示空白） */
    .memo-sub-preview { display: flex; flex-direction: column; gap: 8px; margin-top: 2px; }
    .memo-sub-preview-item {
      border: 1px solid var(--border-subtle); border-radius: var(--radius-btn);
      padding: 8px 10px; background: var(--bg-input);
    }
    .memo-sub-preview-head {
      display: flex; align-items: center; gap: 7px; margin-bottom: 4px;
      font-size: 12.5px; font-weight: 590; color: var(--text-primary);
    }
    .memo-sub-preview-head .hash { font: 600 13px Consolas, monospace; color: var(--brand); }
    .memo-sub-preview-body {
      font: 12px/1.7 Consolas, "Courier New", "Microsoft YaHei", monospace;
      color: var(--text-secondary); white-space: pre-wrap; word-break: break-word;
      margin: 0; max-height: 180px; overflow-y: auto;
    }
    /* v1.0.3（用户反馈 2）：角色列表 + 点击进入编辑（角色名 ≤30 字符） */
    .role-layout { display: flex; gap: 12px; flex: 1; min-height: 0; }
    .role-list {
      width: 210px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px;
      overflow-y: auto; align-content: flex-start; padding-right: 2px;
    }
    .role-item {
      display: flex; align-items: center; gap: 7px;
      padding: 9px 10px; border-radius: var(--radius-btn); cursor: pointer;
      background: var(--bg-input); border: 1px solid var(--border-standard);
      color: var(--text-secondary); flex-shrink: 0;
    }
    .role-item:hover { border-color: rgba(94,106,210,.5); }
    .role-item:active { transform: scale(0.97); transition-duration: .08s; }
    .role-item.active { background: linear-gradient(90deg, rgba(124,120,255,0.16), rgba(124,120,255,0.04)); border-color: rgba(124,120,255,0.55); color: var(--text-primary); }
    .role-item-icon { font-size: 13px; flex-shrink: 0; }
    .role-item-name {
      font-size: 12.5px; font-weight: 590; flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .role-item-desc {
      font-size: 10.5px; color: var(--text-quaternary); max-width: 70px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0;
    }
    .role-item .del { width: 22px; height: 22px; flex-shrink: 0; border: none; background: transparent; cursor: pointer; color: var(--text-quaternary); font-size: 12px; border-radius: 6px; }
    .role-item .del:hover { color: #ff6b6b; background: rgba(255,107,107,.12); }
    .role-editor {
      flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px;
      background: var(--bg-input); border: 1px solid var(--border-standard);
      border-radius: var(--radius-btn); padding: 12px 14px; overflow-y: auto;
    }
    .role-editor-head { display: flex; align-items: center; gap: 8px; }
    .role-editor-name {
      flex: 1; min-width: 0; padding: 8px 11px; font-size: 13.5px; font-weight: 590;
      background: var(--bg-input); border: 1px solid var(--border-standard);
      border-radius: 8px; color: var(--text-primary); outline: none;
    }
    .role-editor-name:focus { border-color: rgba(94,106,210,.55); }
    .role-editor-count { font-size: 11px; color: var(--text-quaternary); flex-shrink: 0; }
    /* v1.0.3（用户反馈 4）：角色字段输入化 —— 定位 / 详细记忆 固定字段，结构标题不可删 */
    .role-field { display: flex; flex-direction: column; gap: 5px; }
    .role-field-label {
      font-size: 12px; font-weight: 590; color: var(--brand);
      font-family: Consolas, "Courier New", "Microsoft YaHei", monospace;
    }
    .role-field-label .role-field-hint { font-weight: 400; color: var(--text-quaternary); margin-left: 6px; font-family: inherit; font-size: 11px; }
    .role-field-input {
      min-height: 44px; resize: vertical; width: 100%; box-sizing: border-box;
      padding: 8px 11px;
      background: var(--bg-input); border: 1px solid var(--border-standard);
      border-radius: var(--radius-btn); color: var(--text-primary); outline: none;
      font: 12.5px/1.6 Consolas, "Courier New", "Microsoft YaHei", monospace;
      white-space: pre-wrap;
    }
    .role-field-input:focus { border-color: rgba(94,106,210,.55); }
    /* v1.0.1（用户指令）：去掉左下角双路径显示（按钮直达目录即可） */
    .path {
      font-size: 11px; color: var(--text-quaternary); flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* 保存后整理记忆确认条 */
    .tidy-bar {
      display: none; align-items: center; gap: 10px; margin-top: 10px;
      font-size: 13px; color: var(--text-primary);
      background: rgba(94,106,210,.08); border: 1px solid rgba(94,106,210,.35);
      border-radius: var(--radius-btn); padding: 9px 14px;
    }
    .tidy-bar.show { display: flex; }
    .tidy-bar .ask { flex: 1; }
    .tidy-bar button {
      padding: 6px 16px; border: none; border-radius: var(--radius-btn); cursor: pointer;
      font-size: 12.5px; font-weight: 590;
    }
    .tidy-bar .tidy-yes { background: var(--brand); color: #fff; }
    .tidy-bar .tidy-yes:hover { background: var(--accent-hover); }
    .tidy-bar .tidy-no { background: var(--bg-hover); color: var(--text-secondary); }
    .tidy-bar .tidy-no:hover { color: var(--text-primary); }
    /* 其他区块：标题可改 + 长文本 */
    .sec-title-input {
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    }
    .sec-title-input .hash { font: 600 15px Consolas, monospace; color: var(--brand); }
    .sec-title-input input {
      flex: 1; padding: 7px 11px; font-size: 14px; font-weight: 590;
      background: var(--bg-input); border: 1px solid var(--border-standard);
      border-radius: 8px; color: var(--text-primary); outline: none;
      font-family: Consolas, "Courier New", "Microsoft YaHei", sans-serif;
    }
    .sec-title-input input:focus { border-color: rgba(94,106,210,.55); }
    .sec-body {
      flex: 1; min-height: 120px; resize: none; width: 100%; box-sizing: border-box;
      padding: 10px 12px;
      background: var(--bg-input); border: 1px solid var(--border-standard);
      border-radius: var(--radius-btn); color: var(--text-primary);
      font: 12.5px/1.7 Consolas, "Courier New", "Microsoft YaHei", monospace; outline: none;
      white-space: pre;
    }
    .sec-body:focus { border-color: rgba(94,106,210,.55); }
    .sec-empty { font-size: 12.5px; color: var(--text-quaternary); padding: 20px 4px; text-align: center; }
    .foot { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
    .path { font-size: 11px; color: var(--text-quaternary); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn {
      padding: 9px 22px; border: none; border-radius: var(--radius-btn); cursor: pointer;
      font-size: 13px; font-weight: 590; background: var(--brand); color: #fff;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn.ghost {
      background: transparent; color: var(--text-secondary);
      border: 1px solid var(--border-standard);
    }
    .btn.ghost:hover { background: var(--bg-hover); }
  </style>
</head>
<body>
  <h1>🧠 记忆管理</h1>
  <div class="subtitle"><b>全局记忆</b>用于所有对话（写入 <code>~/.dsh/AGENTS.md</code>）；<b>项目记忆</b>仅当前项目生效（写入 <code>&lt;工作区&gt;/AGENTS.md</code>，DSH 启动自动读取）。</div>
  <div class="tabs">
    <button id="tab-global" class="tab active" data-tab="global">🌐 全局记忆</button>
    <button id="tab-project" class="tab" data-tab="project">📁 项目记忆</button>
  </div>
  <!-- Tab 1：全局记忆（原有功能原样保留，零回归） -->
  <div id="panel-global" class="panel">
  <!-- v1.0.3（用户反馈 2）：默认角色实际在「我的设定」里选择，提示文案修正 -->
  <div class="tip-red">⚠️ 双击对话框选择角色，默认角色请在[我的设定]中选择</div>
  <div id="banner" class="banner"></div>
  <!-- v1.0.5（用户反馈 4）：解析异常 → 一键恢复备份 -->
  <div id="corrupt-bar" class="corrupt-bar">
    <span>⚠️ 检测到记忆文件解析异常（可能被外部修改损坏），保存会覆盖异常内容。</span>
    <button id="btn-restore-bak" class="restore-bak">从备份恢复（.bak）</button>
  </div>
  <div class="layout">
    <div class="left" id="cats"></div>
    <div class="right">
      <div class="right-head" id="right-head"></div>
      <div id="right-body" style="flex:1;min-height:0;display:flex;flex-direction:column;"></div>
    </div>
  </div>
  <div class="foot">
    <!-- v1.0.1（用户指令）：去掉左下角双路径显示；按钮改名「记忆文件位置(AGENTS)」+「角色文件位置」 -->
    <span id="path" class="path"></span>
    <button id="btn-open-memory" class="btn ghost">记忆文件位置(AGENTS)</button>
    <button id="btn-open-roles" class="btn ghost">角色文件位置</button>
    <button id="btn-save" class="btn">保存</button>
  </div>
  <div id="tidy-bar" class="tidy-bar">
    <span id="tidy-ask" class="ask">要不要让 DSH 整理一下你的全局记忆？（不影响原意）</span>
    <button id="tidy-yes" class="tidy-yes">立即整理</button>
    <button id="tidy-no" class="tidy-no">不用</button>
  </div>
  </div><!-- /panel-global -->
  <!-- Tab 2：项目记忆（v1.2.3 重构：三栏 —— 项目列表 | 区块导航 | 内容编辑，对齐全局记忆左导航） -->
  <div id="panel-project" class="panel" hidden>
    <div id="pm-banner" class="banner"></div>
    <div id="pm-guide" class="pm-guide" hidden></div>
    <div id="pm-main" class="pm-main" style="display:none;">
      <div class="pm-side">
        <div class="pm-side-head">项目列表</div>
        <div id="pm-list" style="display:flex;flex-direction:column;gap:6px;"></div>
        <button id="pm-new" class="add-field">＋ 新建项目</button>
        <div id="pm-new-row" style="display:none;flex-direction:column;gap:6px;">
          <input id="pm-new-path" placeholder="输入已存在项目路径" style="padding:7px 9px;background:var(--bg-input);border:1px solid var(--border-standard);border-radius:8px;color:var(--text-primary);font-size:12px;outline:none;">
          <div style="display:flex;gap:6px;">
            <button id="pm-new-go" class="btn ghost" style="flex:1;padding:6px 10px;">打开</button>
            <button id="pm-new-cancel" class="btn ghost" style="flex:1;padding:6px 10px;">取消</button>
          </div>
        </div>
      </div>
      <div class="pm-navcol">
        <div class="pm-side-head">区块导航</div>
        <div id="pm-nav" class="memo-list pm-nav-list"></div>
        <button id="pm-add-sec" class="add-field pm-add-nav-btn">＋ 添加区块</button>
        <button id="pm-add-sub-nav" class="add-field pm-add-nav-btn">＋ 添加子区块</button>
      </div>
      <div class="pm-editor">
        <div id="pm-editor-head" style="font-size:12.5px;color:var(--text-secondary);">正在编辑：<span id="pm-current-path"></span></div>
        <textarea id="pm-head" class="pm-head-input" placeholder="# 项目记忆（可选头部，如 # 项目名）"></textarea>
        <div id="pm-editor" class="memo-editor"></div>
        <div id="pm-empty" class="pm-empty" hidden>此项目还没有记忆，点左栏「＋ 添加区块」创建第一条</div>
        <div class="pm-foot">
          <span class="spacer"></span>
          <button id="pm-open-folder" class="btn ghost" style="padding:6px 14px;">打开目录</button>
          <button id="pm-delete" class="btn ghost" style="padding:6px 14px;color:#e5484d;">删除项目记忆</button>
          <button id="pm-save" class="btn" style="padding:8px 20px;">保存</button>
        </div>
      </div>
    </div>
  </div>
  <script src="global-memory.js"></script>
  <script src="memory-project.js"></script>
</body>
</html>
