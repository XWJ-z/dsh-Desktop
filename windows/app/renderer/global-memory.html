<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; style-src 'self' file: 'unsafe-inline'; script-src 'self' file:; img-src 'self' file: data:" />
  <title>全局记忆</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    body {
      align-items: stretch;
      padding: 18px 20px 20px;
      height: 100vh;
      overflow: hidden; /* 滚动交给内部容器 */
      display: flex;
      flex-direction: column;
    }
    h1 { font-size: 18px; font-weight: 590; margin-bottom: 2px; }
    .subtitle { font-size: 12px; color: var(--text-quaternary); margin-bottom: 12px; line-height: 1.7; }
    .subtitle code { background: var(--bg-hover); padding: 1px 5px; border-radius: 4px; font-size: 11px; }
    /* 反馈横幅 */
    .banner {
      display: none; padding: 9px 14px; margin-bottom: 12px;
      border-radius: var(--radius-btn); font-size: 13px; font-weight: 590;
    }
    .banner.show { display: block; }
    .banner.ok { color: var(--success); background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.3); }
    .banner.fail { color: var(--warn); background: rgba(245,166,35,.1); border: 1px solid rgba(245,166,35,.3); }
    /* v1.0.5（老大反馈 4）：解析异常恢复提示条（一键从 .bak 恢复） */
    .corrupt-bar {
      display: none; align-items: center; gap: 10px; margin-bottom: 12px;
      padding: 9px 14px; border-radius: var(--radius-btn); font-size: 12.5px; line-height: 1.6;
      color: #e5484d; background: rgba(229,72,77,.08); border: 1px solid rgba(229,72,77,.35);
    }
    .corrupt-bar.show { display: flex; }
    .corrupt-bar span { flex: 1; }
    .corrupt-bar .restore-bak {
      padding: 6px 14px; border: none; border-radius: var(--radius-btn); cursor: pointer;
      font-size: 12.5px; font-weight: 590; background: #e5484d; color: #fff; flex-shrink: 0;
    }
    .corrupt-bar .restore-bak:hover { background: #d63b40; }
    .corrupt-bar .restore-bak:disabled { opacity: .5; cursor: default; }
    /* 左右分栏（参考提示词库） */
    .layout { display: flex; gap: 16px; flex: 1; min-height: 0; }
    .left {
      width: 220px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px;
      overflow-y: auto; align-content: flex-start;
    }
    .cat {
      padding: 10px 12px; border-radius: var(--radius-btn); cursor: pointer;
      font-size: 13px; color: var(--text-secondary);
      background: transparent; border: 1px solid transparent;
      display: flex; align-items: center; gap: 6px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .cat:hover { background: var(--bg-hover); }
    .cat.active { background: var(--bg-surface); border-color: rgba(94,106,210,.4); color: var(--text-primary); }
    .cat .tag {
      font-size: 10.5px; color: var(--text-quaternary); flex-shrink: 0;
      background: var(--bg-hover); border-radius: 999px; padding: 1px 7px;
    }
    .cat .sec-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .cat-add {
      margin-top: 6px; padding: 9px 12px; border: 1px dashed var(--border-standard);
      border-radius: var(--radius-btn); background: transparent; color: var(--text-secondary);
      cursor: pointer; font-size: 13px; font-weight: 590; text-align: center;
    }
    .cat-add:hover { color: var(--brand); border-color: rgba(94,106,210,.55); background: var(--bg-hover); }
    .right {
      flex: 1; min-width: 0; display: flex; flex-direction: column;
      background: var(--bg-surface); border: 1px solid var(--border-standard);
      border-radius: var(--radius-card); padding: 14px 16px;
    }
    .right-head { font-size: 14px; font-weight: 590; color: var(--text-primary); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .right-head .tag {
      font-size: 10.5px; font-weight: 400; color: var(--text-quaternary);
      background: var(--bg-hover); border-radius: 999px; padding: 1px 8px;
    }
    /* 基础设定字段列表 */
    .fields { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }
    .row {
      display: flex; gap: 10px; align-items: stretch;
      background: var(--bg-input); border: 1px solid var(--border-standard);
      border-radius: var(--radius-btn); padding: 8px 10px;
    }
    .row .f-name {
      width: 148px; flex-shrink: 0; padding: 8px 10px;
      background: var(--bg-input); border: 1px solid var(--border-standard);
      border-radius: 8px; color: var(--text-primary);
      font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; outline: none;
    }
    .row .f-value {
      flex: 1; min-width: 0; padding: 8px 10px; min-height: 36px; resize: vertical;
      background: var(--bg-input); border: 1px solid var(--border-standard);
      border-radius: 8px; color: var(--text-primary);
      font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; outline: none;
    }
    .row .f-name:focus, .row .f-value:focus { border-color: rgba(94,106,210,.55); }
    .row .f-name::placeholder, .row .f-value::placeholder { color: var(--text-quaternary); }
    /* 默认角色下拉选择（v0.9.13） */
    .row .f-select {
      min-height: 36px; cursor: pointer; appearance: auto;
      font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .row .del {
      width: 30px; flex-shrink: 0; border: none; background: transparent; cursor: pointer;
      color: var(--text-quaternary); font-size: 15px; border-radius: 8px;
    }
    .row .del:hover { color: #ff6b6b; background: rgba(255,107,107,.12); }
    .add-field {
      padding: 8px 14px; border: 1px dashed var(--border-standard); border-radius: var(--radius-btn);
      background: transparent; color: var(--text-secondary); cursor: pointer;
      font-size: 13px; font-weight: 590; align-self: flex-start;
    }
    .add-field:hover { color: var(--brand); border-color: rgba(94,106,210,.55); background: var(--bg-hover); }
    /* 基础设定内的子组标签（你的信息 / 角色设定） */
    .group-label {
      font-size: 12.5px; font-weight: 590; color: var(--text-secondary);
      margin: 4px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border-standard);
    }
    .group-label.role { margin-top: 14px; color: var(--brand); }
    .group-label .hint { font-weight: 400; color: var(--text-quaternary); margin-left: 8px; font-size: 11px; }
    /* 未配置引导提示条 */
    .guide-tip {
      font-size: 12px; line-height: 1.7; color: var(--warn);
      background: rgba(245,166,35,.08); border: 1px solid rgba(245,166,35,.3);
      border-radius: var(--radius-btn); padding: 8px 12px; margin-bottom: 10px;
    }
    /* v0.9.15（老大指令）：双击对话框选择角色提示（红色字体） */
    .tip-red {
      font-size: 12.5px; line-height: 1.7; font-weight: 590; color: #e5484d;
      background: rgba(229,72,77,.08); border: 1px solid rgba(229,72,77,.35);
      border-radius: var(--radius-btn); padding: 8px 12px; margin-bottom: 10px;
    }
    /* v0.9.16（老大指令）：标题后红色标注（DSH 视角），提醒配置角色别搞成用户视角 */
    .dsh-view {
      color: #e5484d; font-size: 13px; font-weight: 590;
      margin-left: 2px;
    }
    /* v1.0.2（老大指令 2/3）：全局记忆区块 / DSH 角色 —— 卡片列表式（合并 ## 区块 / 角色文件全文） */
    .memo-list, .role-cards {
      display: flex; flex-direction: column; gap: 10px;
      overflow-y: auto; flex: 1; min-height: 0; padding-right: 2px;
    }
    .memo-card, .role-card {
      background: var(--bg-input); border: 1px solid var(--border-standard);
      border-radius: var(--radius-btn); padding: 8px 10px;
      display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
    }
    .memo-head, .role-card-head { display: flex; align-items: center; gap: 8px; }
    .memo-head .hash { font: 600 15px Consolas, monospace; color: var(--brand); }
    .memo-title, .role-card-name {
      flex: 1; min-width: 0; padding: 7px 11px; font-size: 13.5px; font-weight: 590;
      background: var(--bg-input); border: 1px solid var(--border-standard);
      border-radius: 8px; color: var(--text-primary); outline: none;
    }
    .memo-title { font-family: Consolas, "Courier New", "Microsoft YaHei", sans-serif; font-size: 14px; }
    .memo-title:focus, .role-card-name:focus { border-color: rgba(94,106,210,.55); }
    .memo-card .fold {
      width: 26px; height: 26px; flex-shrink: 0; border: none; background: transparent;
      cursor: pointer; color: var(--text-quaternary); font-size: 13px; border-radius: 6px;
    }
    .memo-card .fold:hover { color: var(--text-primary); background: var(--bg-hover); }
    .role-card .role-icon { font-size: 15px; }
    .role-card-body { min-height: 120px; }
    /* v1.0.3（老大反馈 2）：角色列表 + 点击进入编辑（角色名 ≤30 字符） */
    .role-layout { display: flex; gap: 12px; flex: 1; min-height: 0; }
    .role-list {
      width: 210px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px;
      overflow-y: auto; align-content: flex-start; padding-right: 2px;
    }
    .role-item {
      display: flex; align-items: center; gap: 7px;
      padding: 9px 10px; border-radius: var(--radius-btn); cursor: pointer;
      background: var(--bg-input); border: 1px solid var(--border-standard);
      color: var(--text-secondary); flex-shrink: 0;
    }
    .role-item:hover { border-color: rgba(94,106,210,.5); }
    .role-item.active { background: var(--bg-surface); border-color: rgba(94,106,210,.55); color: var(--text-primary); }
    .role-item-icon { font-size: 13px; flex-shrink: 0; }
    .role-item-name {
      font-size: 12.5px; font-weight: 590; flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .role-item-desc {
      font-size: 10.5px; color: var(--text-quaternary); max-width: 70px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0;
    }
    .role-item .del { width: 22px; height: 22px; flex-shrink: 0; border: none; background: transparent; cursor: pointer; color: var(--text-quaternary); font-size: 12px; border-radius: 6px; }
    .role-item .del:hover { color: #ff6b6b; background: rgba(255,107,107,.12); }
    .role-editor {
      flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px;
      background: var(--bg-input); border: 1px solid var(--border-standard);
      border-radius: var(--radius-btn); padding: 12px 14px; overflow-y: auto;
    }
    .role-editor-head { display: flex; align-items: center; gap: 8px; }
    .role-editor-name {
      flex: 1; min-width: 0; padding: 8px 11px; font-size: 13.5px; font-weight: 590;
      background: var(--bg-input); border: 1px solid var(--border-standard);
      border-radius: 8px; color: var(--text-primary); outline: none;
    }
    .role-editor-name:focus { border-color: rgba(94,106,210,.55); }
    .role-editor-count { font-size: 11px; color: var(--text-quaternary); flex-shrink: 0; }
    /* v1.0.3（老大反馈 4）：角色字段输入化 —— 定位 / 详细记忆 固定字段，结构标题不可删 */
    .role-field { display: flex; flex-direction: column; gap: 5px; }
    .role-field-label {
      font-size: 12px; font-weight: 590; color: var(--brand);
      font-family: Consolas, "Courier New", "Microsoft YaHei", monospace;
    }
    .role-field-label .role-field-hint { font-weight: 400; color: var(--text-quaternary); margin-left: 6px; font-family: inherit; font-size: 11px; }
    .role-field-input {
      min-height: 44px; resize: vertical; width: 100%; box-sizing: border-box;
      padding: 8px 11px;
      background: var(--bg-input); border: 1px solid var(--border-standard);
      border-radius: var(--radius-btn); color: var(--text-primary); outline: none;
      font: 12.5px/1.6 Consolas, "Courier New", "Microsoft YaHei", monospace;
      white-space: pre-wrap;
    }
    .role-field-input:focus { border-color: rgba(94,106,210,.55); }
    /* v1.0.1（老大指令）：去掉左下角双路径显示（按钮直达目录即可） */
    .path {
      font-size: 11px; color: var(--text-quaternary); flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* 保存后整理记忆确认条 */
    .tidy-bar {
      display: none; align-items: center; gap: 10px; margin-top: 10px;
      font-size: 13px; color: var(--text-primary);
      background: rgba(94,106,210,.08); border: 1px solid rgba(94,106,210,.35);
      border-radius: var(--radius-btn); padding: 9px 14px;
    }
    .tidy-bar.show { display: flex; }
    .tidy-bar .ask { flex: 1; }
    .tidy-bar button {
      padding: 6px 16px; border: none; border-radius: var(--radius-btn); cursor: pointer;
      font-size: 12.5px; font-weight: 590;
    }
    .tidy-bar .tidy-yes { background: var(--brand); color: #fff; }
    .tidy-bar .tidy-yes:hover { background: var(--accent-hover); }
    .tidy-bar .tidy-no { background: var(--bg-hover); color: var(--text-secondary); }
    .tidy-bar .tidy-no:hover { color: var(--text-primary); }
    /* 其他区块：标题可改 + 长文本 */
    .sec-title-input {
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    }
    .sec-title-input .hash { font: 600 15px Consolas, monospace; color: var(--brand); }
    .sec-title-input input {
      flex: 1; padding: 7px 11px; font-size: 14px; font-weight: 590;
      background: var(--bg-input); border: 1px solid var(--border-standard);
      border-radius: 8px; color: var(--text-primary); outline: none;
      font-family: Consolas, "Courier New", "Microsoft YaHei", sans-serif;
    }
    .sec-title-input input:focus { border-color: rgba(94,106,210,.55); }
    .sec-body {
      flex: 1; min-height: 120px; resize: none; width: 100%; box-sizing: border-box;
      padding: 10px 12px;
      background: var(--bg-input); border: 1px solid var(--border-standard);
      border-radius: var(--radius-btn); color: var(--text-primary);
      font: 12.5px/1.7 Consolas, "Courier New", "Microsoft YaHei", monospace; outline: none;
      white-space: pre;
    }
    .sec-body:focus { border-color: rgba(94,106,210,.55); }
    .sec-empty { font-size: 12.5px; color: var(--text-quaternary); padding: 20px 4px; text-align: center; }
    .foot { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
    .path { font-size: 11px; color: var(--text-quaternary); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn {
      padding: 9px 22px; border: none; border-radius: var(--radius-btn); cursor: pointer;
      font-size: 13px; font-weight: 590; background: var(--brand); color: #fff;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn.ghost {
      background: transparent; color: var(--text-secondary);
      border: 1px solid var(--border-standard);
    }
    .btn.ghost:hover { background: var(--bg-hover); }
  </style>
</head>
<body>
  <h1>🧠 全局记忆 <span class="dsh-view">(DSH 视角)</span></h1>
  <div class="subtitle">写入 <code>~/.dsh/AGENTS.md</code>（DSH 的视角）：「用户设定」记用户是谁、「我的设定」记 DSH 自己（含默认角色下拉）、「全局记忆区块」汇总其他 ## 区块、「DSH 角色」每个角色对应 <code>~/.dsh/roles/</code> 一个文件（输入框即文件全文，两边同步）。覆盖已有内容保存时需二次确认。</div>
  <!-- v1.0.3（老大反馈 2）：默认角色实际在「我的设定」里选择，提示文案修正 -->
  <div class="tip-red">⚠️ 双击对话框选择角色，默认角色请在[我的设定]中选择</div>
  <div id="banner" class="banner"></div>
  <!-- v1.0.5（老大反馈 4）：解析异常 → 一键恢复备份 -->
  <div id="corrupt-bar" class="corrupt-bar">
    <span>⚠️ 检测到记忆文件解析异常（可能被外部修改损坏），保存会覆盖异常内容。</span>
    <button id="btn-restore-bak" class="restore-bak">从备份恢复（.bak）</button>
  </div>
  <div class="layout">
    <div class="left" id="cats"></div>
    <div class="right">
      <div class="right-head" id="right-head"></div>
      <div id="right-body" style="flex:1;min-height:0;display:flex;flex-direction:column;"></div>
    </div>
  </div>
  <div class="foot">
    <!-- v1.0.1（老大指令）：去掉左下角双路径显示；按钮改名「记忆文件位置(AGENTS)」+「角色文件位置」 -->
    <span id="path" class="path"></span>
    <button id="btn-open-memory" class="btn ghost">记忆文件位置(AGENTS)</button>
    <button id="btn-open-roles" class="btn ghost">角色文件位置</button>
    <button id="btn-save" class="btn">保存</button>
  </div>
  <div id="tidy-bar" class="tidy-bar">
    <span id="tidy-ask" class="ask">要不要让 DSH 整理一下你的全局记忆？（不影响原意）</span>
    <button id="tidy-yes" class="tidy-yes">立即整理</button>
    <button id="tidy-no" class="tidy-no">不用</button>
  </div>
  <script src="global-memory.js"></script>
</body>
</html>
