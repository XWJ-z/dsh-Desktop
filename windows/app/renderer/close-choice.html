<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; style-src 'unsafe-inline'; script-src 'self' file:; img-src 'self' file: data:" />
  <title>关闭 DSH-Desktop</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-deep: #08090a;
      --bg-surface: #191a1b;
      --text-primary: #f7f8f8;
      --text-tertiary: #8a8f98;
      --brand: #5e6ad2;
      --accent: #7170ff;
      --accent-hover: #828fff;
      --border-standard: rgba(255,255,255,0.08);
      --radius-btn: 6px;
      --font: 'Inter', 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background:
        radial-gradient(500px 240px at 50% -15%, rgba(94,106,210,0.12) 0%, transparent 60%),
        var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 28px;
      user-select: none;
    }
    h1 { font-size: 18px; font-weight: 590; letter-spacing: -0.24px; margin-bottom: 18px; }
    .btn-row { display: flex; gap: 10px; width: 100%; }
    .btn {
      flex: 1; padding: 10px 0; border-radius: var(--radius-btn); font-size: 14px; font-weight: 590;
      cursor: pointer; border: none; text-align: center; color: #fff;
      background: var(--brand);
    }
    .btn:hover { background: var(--accent-hover); }
    .btn.ghost {
      background: rgba(255,255,255,0.02); color: var(--text-tertiary);
      border: 1px solid var(--border-standard);
    }
    .btn.ghost:hover { color: var(--text-primary); border-color: rgba(255,255,255,0.16); }
    .remember {
      margin-top: 16px; display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--text-tertiary); cursor: pointer;
    }
    .remember input {
      width: 14px; height: 14px; accent-color: var(--accent); cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>关闭 DSH-Desktop？</h1>
  <div class="btn-row">
    <button class="btn" id="btn-tray">关闭到托盘</button>
    <button class="btn ghost" id="btn-quit">退出</button>
  </div>
  <label class="remember">
    <input type="checkbox" id="remember" />
    记住我的选择，下次不再询问
  </label>
  <script src="close-choice.js"></script>
</body>
</html>
