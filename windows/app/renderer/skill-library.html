<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; style-src 'self' file: 'unsafe-inline'; script-src 'self' file:; img-src 'self' file: data:" />
  <title>技能库</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    body { padding: 18px 20px 20px; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    h1 { font-size: 18px; font-weight: 590; margin-bottom: 2px; }
    .subtitle { font-size: 12px; color: var(--text-quaternary); margin-bottom: 12px; line-height: 1.7; }
    .subtitle .warn { color: #e5484d; }
    .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-shrink: 0; background: var(--bg-hover); padding: 4px; border-radius: var(--radius-btn); }
    .tabs .tab { flex: 1; padding: 8px 12px; border: none; border-radius: calc(var(--radius-btn) - 2px); background: transparent; cursor: pointer; font-size: 13px; font-weight: 590; color: var(--text-secondary); transition: background .15s, color .15s; }
    .tabs .tab:hover { color: var(--text-primary); }
    .tabs .tab.active { background: var(--bg-surface); color: var(--text-primary); box-shadow: 0 1px 4px rgba(0,0,0,.15); }
    .panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .panel[hidden] { display: none; }
    .banner { display: none; padding: 9px 14px; margin-bottom: 10px; border-radius: var(--radius-btn); font-size: 13px; font-weight: 590; }
    .banner.show { display: block; }
    .banner.ok { color: var(--success); background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.3); }
    .banner.fail { color: var(--warn); background: rgba(245,166,35,.1); border: 1px solid rgba(245,166,35,.3); }
    /* 已装技能 */
    .card-grid { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; min-height: 0; padding-right: 2px; }
    .skill-card { background: var(--bg-input); border: 1px solid var(--border-standard); border-top-color: var(--border-strong); border-radius: var(--radius-card); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
    .skill-card-head { display: flex; align-items: center; gap: 8px; }
    .skill-card-name { font-size: 14px; font-weight: 600; color: var(--text-primary); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .skill-card .tag { font-size: 10.5px; color: var(--text-quaternary); background: var(--bg-hover); border-radius: 999px; padding: 1px 8px; flex-shrink: 0; }
    .skill-card-desc { font-size: 12.5px; color: var(--text-secondary); line-height: 1.6; }
    .skill-card-req { font-size: 11.5px; color: var(--text-quaternary); line-height: 1.6; background: var(--bg-hover); border-radius: var(--radius-btn); padding: 6px 9px; }
    .skill-card-req .req-label { color: var(--warn); font-weight: 590; margin-right: 6px; flex-shrink: 0; }
    .skill-card-actions { display: flex; gap: 8px; }
    .btn.sm { padding: 6px 14px; font-size: 12.5px; }
    .btn.ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border-standard); }
    .btn.ghost:hover { background: var(--bg-hover); color: var(--text-primary); }
    .btn.danger { color: #e5484d; }
    .empty { font-size: 12.5px; color: var(--text-quaternary); padding: 24px 6px; text-align: center; }
    /* 自建技能 */
    .create-wrap { display: flex; gap: 14px; flex: 1; min-height: 0; }
    .create-list { width: 230px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
    .create-list-head { font-size: 12px; font-weight: 590; color: var(--text-secondary); margin: 2px 4px 0; }
    .create-item { display: flex; align-items: center; gap: 7px; padding: 9px 10px; border-radius: var(--radius-btn); cursor: pointer; background: var(--bg-input); border: 1px solid var(--border-standard); color: var(--text-secondary); }
    .create-item:hover { border-color: rgba(94,106,210,.5); }
    .create-item.active { background: linear-gradient(90deg, rgba(124,120,255,0.16), rgba(124,120,255,0.04)); border-color: rgba(124,120,255,0.55); color: var(--text-primary); }
    .create-item-name { font-size: 12.5px; font-weight: 590; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .create-item .del { width: 22px; height: 22px; border: none; background: transparent; cursor: pointer; color: var(--text-quaternary); font-size: 12px; border-radius: 6px; }
    .create-item .del:hover { color: #ff6b6b; background: rgba(255,107,107,.12); }
    .create-form { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; background: var(--bg-input); border: 1px solid var(--border-standard); border-radius: var(--radius-btn); padding: 12px 14px; overflow-y: auto; }
    .field-label { font-size: 12px; font-weight: 590; color: var(--brand); }
    .field-label .hint { font-weight: 400; color: var(--text-quaternary); margin-left: 6px; font-size: 11px; }
    .field-feedback { display: none; font-size: 11px; color: #e5484d; margin-top: 4px; line-height: 1.5; }
    .field-feedback.bad { display: block; }
    .inp, textarea.inp { width: 100%; box-sizing: border-box; padding: 8px 10px; background: var(--bg-input); border: 1px solid var(--border-standard); border-radius: var(--radius-btn); color: var(--text-primary); font: 12.5px/1.6 Consolas, "Courier New", "Microsoft YaHei", monospace; outline: none; }
    .inp:focus, textarea.inp:focus { border-color: rgba(94,106,210,.55); }
    textarea.inp { resize: vertical; white-space: pre-wrap; }
    .create-actions { display: flex; gap: 8px; margin-top: 2px; }
    /* 技能市场 */
    .market-bar { display: flex; gap: 8px; margin-bottom: 10px; flex-shrink: 0; }
    .market-bar input { flex: 1; padding: 8px 11px; background: var(--bg-input); border: 1px solid var(--border-standard); border-radius: var(--radius-btn); color: var(--text-primary); font-size: 12.5px; outline: none; }
    .market-bar input:focus { border-color: rgba(94,106,210,.55); }
    .market-bar select { padding: 8px 10px; background: var(--bg-input); border: 1px solid var(--border-standard); border-radius: var(--radius-btn); color: var(--text-primary); font-size: 12.5px; outline: none; }
    .market-cat { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; flex-shrink: 0; }
    .cat-chip { padding: 5px 12px; border: 1px solid var(--border-standard); border-radius: 999px; background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 12px; }
    .cat-chip:hover { border-color: rgba(94,106,210,.5); }
    .cat-chip.active { background: var(--brand); border-color: var(--brand); color: #fff; }
    .market-secure { font-size: 12px; line-height: 1.7; color: var(--warn); background: rgba(245,166,35,.08); border: 1px solid rgba(245,166,35,.3); border-radius: var(--radius-btn); padding: 8px 12px; margin-bottom: 10px; flex-shrink: 0; }
  </style>
</head>
<body>
  <h1>🛠️ 技能库</h1>
  <div class="subtitle">技能 = 给模型的指令包（YAML frontmatter + Markdown 正文）。<span class="warn">⚠️ 技能内容会注入模型上下文，安装/使用前请确认来源可信。</span></div>
  <div class="tabs">
    <button id="tab-installed" class="tab active" data-tab="installed">📦 已装技能</button>
    <button id="tab-market" class="tab" data-tab="market">🌐 技能市场</button>
  </div>
  <!-- 已装技能 -->
  <div id="panel-installed" class="panel">
    <div id="inst-banner" class="banner"></div>
    <div id="inst-list" class="card-grid"></div>
  </div>
  <!-- 技能市场 -->
  <div id="panel-market" class="panel" hidden>
    <div id="market-banner" class="banner"></div>
    <div class="market-secure">⚠️ 技能市场 = 多来源精选列表（skills-list.json，含 Anthropic 官方 anthropics/skills 等）。安装会从对应 GitHub 仓库拉取 SKILL.md 写入本地。技能是纯文本指令（无代码执行风险），但<b>内容会注入模型</b>，请确认来源可信；每项已标注<b>安装要求</b>，可用「复制安装指令」留存待办。</div>
    <div class="market-bar">
      <input id="market-search" placeholder="搜索技能…" />
      <button id="market-refresh" class="btn ghost" style="padding:8px 16px;">刷新</button>
    </div>
    <div id="market-cats" class="market-cat"></div>
    <div id="market-list" class="card-grid"></div>
  </div>
  <script src="skill-library.js"></script>
</body>
</html>
