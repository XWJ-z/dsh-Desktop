<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; style-src 'unsafe-inline'; script-src 'self' file:; img-src 'self' file: data:" />
  <title>DSH-Desktop — 正在启动…</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1a2233 0%, #0f1115 60%);
      color: #dbe2f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      user-select: none;
    }
    .logo {
      width: 72px; height: 72px;
      border-radius: 18px;
      object-fit: contain;
      box-shadow: 0 12px 40px rgba(90, 110, 255, 0.35);
      animation: logoIn .6s ease-out;
    }
    @keyframes logoIn {
      from { opacity: 0; transform: scale(0.82); }
      to   { opacity: 1; transform: scale(1); }
    }
    .spinner {
      width: 34px; height: 34px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #6d8dff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title { font-size: 18px; font-weight: 600; }
    .subtitle { font-size: 13px; color: #8b96ad; }
    #stages {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 2px;
    }
    .stage {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      color: #66718a;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      transition: all .25s ease;
    }
    .stage.active {
      color: #9db4ff;
      border-color: rgba(109,141,255,0.5);
      background: rgba(109,141,255,0.12);
      box-shadow: 0 0 14px rgba(109,141,255,0.25);
    }
    .stage.done { color: #6fe3a1; border-color: rgba(111,227,161,0.4); background: rgba(111,227,161,0.08); }
    .stage.done::before { content: '✓ '; }
    #log-wrap { width: min(640px, 80vw); margin-top: 8px; }
    #log-toggle {
      font-size: 11px; color: #5a6478;
      padding: 4px 6px; cursor: pointer; user-select: none;
      width: fit-content;
    }
    #log-toggle:hover { color: #8b96ad; }
    #log {
      height: 0; opacity: 0;
      padding: 0 12px;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      overflow-y: auto;
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 11px;
      line-height: 1.6;
      color: #7f8aa4;
      white-space: pre-wrap;
      word-break: break-all;
      transition: height .25s ease, opacity .25s ease;
    }
    #log-wrap.expanded #log { height: 180px; padding: 10px 12px; opacity: 1; }
    .error { color: #ff7b7b; }
    .verline { font-size: 11px; color: #5a6478; margin-top: 4px; }
  </style>
</head>
