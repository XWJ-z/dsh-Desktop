<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; style-src 'self' file: 'unsafe-inline'; script-src 'self' file:; img-src 'self' file: data:" />
  <title>DSH-Desktop — 正在启动…</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    /* shared.css 提供主题 token + body 基础；此处仅 loading 页面特有样式 */
    body { justify-content: center; gap: 16px; }
    .logo {
      width: 72px; height: 72px;
      border-radius: var(--radius-panel);
      object-fit: contain;
      box-shadow: 0 12px 40px rgba(94,106,210,0.3);
      animation: logoIn .6s ease-out;
    }
    @keyframes logoIn {
      from { opacity: 0; transform: scale(0.82); }
      to   { opacity: 1; transform: scale(1); }
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border-standard);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* v0.8.8（T6）：北极星口号，延迟淡入不抢 logo */
    .motto {
      font-size: 13px;
      color: var(--text-quaternary);
      letter-spacing: 0.5px;
      user-select: none;
      animation: mottoIn .8s ease-out .4s both;
    }
    @keyframes mottoIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .title { font-size: 20px; font-weight: 590; letter-spacing: -0.24px; }
    .subtitle { font-size: 14px; color: var(--text-tertiary); text-align: center; }
    #stages {
      display: flex;
      flex-wrap: wrap;              /* 任务2b：窄窗口自动换行 */
      gap: 8px;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
      max-width: min(720px, 92vw);
    }
    .stage {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      white-space: nowrap;          /* 任务2b：文字不截断 */
      flex-shrink: 0;               /* 任务2b：防挤压 */
      color: var(--text-quaternary);
      background: var(--bg-hover);
      border: 1px solid var(--border-standard);
      transition: all .25s ease;
    }
    .stage.active {
      color: var(--accent);
      border-color: rgba(113,112,255,0.5);
      background: rgba(113,112,255,0.1);
      box-shadow: 0 0 16px rgba(113,112,255,0.2);
    }
    .stage.done { color: var(--success); border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.07); }
    .stage.done::before { content: '✓ '; }
    #log-wrap { width: min(640px, 80vw); margin-top: 8px; }
    #log-toggle {
      font-size: 12px; color: var(--text-quaternary);
      padding: 4px 6px; cursor: pointer; user-select: none;
      width: fit-content;
    }
    #log-toggle:hover { color: var(--text-tertiary); }
    #log {
      height: 0; opacity: 0;
      padding: 0 12px;
      background: var(--bg-panel);
      border: 1px solid var(--border-standard);
      border-radius: var(--radius-card);
      overflow-y: auto;
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.6;
      color: var(--text-tertiary);
      white-space: pre-wrap;
      word-break: break-all;
      transition: height .25s ease, opacity .25s ease;
    }
    #log-wrap.expanded #log { height: 180px; padding: 10px 12px; opacity: 1; }
    .error { color: #ff6b6b; }
    .verline { font-size: 11px; color: var(--text-quaternary); margin-top: 4px; }
  </style>
</head>
