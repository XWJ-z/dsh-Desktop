<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; style-src 'unsafe-inline'; script-src 'self' file:; img-src 'self' file: data:" />
  <title>联系我们</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1a2233 0%, #0f1115 60%);
      color: #dbe2f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      text-align: center;
      user-select: none;
    }
    .logo {
      width: 72px; height: 72px; border-radius: 18px;
      object-fit: contain; box-shadow: 0 12px 40px rgba(90,110,255,0.35);
      margin-bottom: 14px;
    }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #8b96ad; margin-bottom: 20px; }
    .qr-box {
      background: #fff; border-radius: 14px; padding: 10px;
      width: 240px; height: 240px; margin-bottom: 16px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .qr-box img { width: 100%; height: 100%; object-fit: contain; }
    .qr-box .placeholder { color: #8b96ad; font-size: 12px; }
    .group-num { font-size: 22px; font-weight: 700; color: #9db4ff; margin-bottom: 6px; letter-spacing: 1px; }
    .tip { font-size: 13px; color: #8b96ad; line-height: 1.8; margin-bottom: 16px; }
    .btn {
      padding: 11px 44px; border-radius: 10px; font-size: 15px; font-weight: 600;
      cursor: pointer; border: none; color: #fff;
      background: linear-gradient(180deg, #6d8dff, #5a7cf0);
    }
    .btn:hover { filter: brightness(1.1); }
    .copied { margin-top: 10px; font-size: 12px; color: #6fe3a1; min-height: 16px; }
  </style>
</head>
<body>
  <img class="logo" id="logo" alt="" />
  <h1>DSH-Desktop</h1>
  <div class="sub">用户交流群</div>
  <div class="qr-box">
    <img id="qr" alt="QQ 群二维码" style="display:none" />
    <span class="placeholder" id="qr-placeholder">二维码加载中…</span>
  </div>
  <div class="group-num" id="group-num">-</div>
  <div class="tip">扫码或搜索群号加入用户交流群<br />问题反馈 · 功能建议 · 版本更新</div>
  <button class="btn" id="copy-btn">📋 复制群号</button>
  <div class="copied" id="copied"></div>
  <script src="contact.js"></script>
</body>
</html>
