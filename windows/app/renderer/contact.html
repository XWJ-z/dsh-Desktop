<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; style-src 'unsafe-inline'; script-src 'self' file:; img-src 'self' file: data:" />
  <title>联系我们</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-deep: #08090a;
      --bg-panel: #0f1011;
      --bg-surface: #191a1b;
      --bg-hover: #28282c;
      --text-primary: #f7f8f8;
      --text-secondary: #d0d6e0;
      --text-tertiary: #8a8f98;
      --text-quaternary: #62666d;
      --brand: #5e6ad2;
      --accent: #7170ff;
      --accent-hover: #828fff;
      --success: #10b981;
      --warn: #f5a623;
      --border-subtle: rgba(255,255,255,0.05);
      --border-standard: rgba(255,255,255,0.08);
      --radius-btn: 6px;
      --radius-card: 8px;
      --radius-panel: 12px;
      --font: 'Inter', 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background:
        radial-gradient(700px 350px at 50% -12%, rgba(94,106,210,0.12) 0%, transparent 60%),
        var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      user-select: none;
    }
    .logo {
      width: 64px; height: 64px; border-radius: var(--radius-panel);
      object-fit: contain; box-shadow: 0 8px 32px rgba(94,106,210,0.3);
      margin-bottom: 16px;
    }
    h1 { font-size: 20px; font-weight: 590; letter-spacing: -0.24px; margin-bottom: 4px; }
    .sub { font-size: 14px; color: var(--text-tertiary); margin-bottom: 24px; }
    .qr-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-standard);
      border-radius: var(--radius-panel);
      padding: 24px;
      margin-bottom: 20px;
    }
    .qr-box {
      background: #fff; border-radius: var(--radius-card);
      width: 240px; height: 240px; padding: 8px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .qr-box img { width: 100%; height: 100%; object-fit: contain; }
    .qr-box .placeholder { color: var(--text-tertiary); font-size: 12px; }
    .group-num { font-size: 20px; font-weight: 590; color: var(--text-primary); letter-spacing: 1px; margin-bottom: 8px; }
    .tip { font-size: 13px; color: var(--text-tertiary); line-height: 1.8; margin-bottom: 20px; }
    .btn {
      padding: 10px 44px; border-radius: var(--radius-btn); font-size: 14px; font-weight: 590;
      cursor: pointer; border: none; color: #fff;
      background: var(--brand);
    }
    .btn:hover { background: var(--accent-hover); }
    .copied { margin-top: 10px; font-size: 12px; color: var(--success); min-height: 16px; }
  </style>
</head>
<body>
  <img class="logo" id="logo" alt="" />
  <h1>DSH-Desktop</h1>
  <div class="sub">用户交流群</div>
  <div class="qr-card">
    <div class="qr-box">
      <img id="qr" alt="QQ 群二维码" style="display:none" />
      <span class="placeholder" id="qr-placeholder">二维码加载中…</span>
    </div>
  </div>
  <div class="group-num" id="group-num">-</div>
  <div class="tip">扫码或搜索群号加入用户交流群<br />问题反馈 · 功能建议 · 版本更新</div>
  <button class="btn" id="copy-btn">📋 复制群号</button>
  <div class="copied" id="copied"></div>
  <script src="contact.js"></script>
</body>
</html>
