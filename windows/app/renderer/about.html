<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; style-src 'self' file: 'unsafe-inline'; script-src 'self' file:; img-src 'self' file: data:" />
  <title>关于 DSH-Desktop</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    body {
      /* 页面特有：居中排版 + 文字居中（shared.css 提供主题 token 与基础布局） */
      justify-content: center;
      text-align: center;
    }
    .logo {
      width: 64px; height: 64px; border-radius: var(--radius-panel);
      object-fit: contain; box-shadow: 0 8px 32px rgba(94,106,210,0.3);
      margin-bottom: 14px;
    }
    .version-tag { font-size: 14px; color: var(--brand); font-weight: 590; margin-bottom: 20px; }
    .card {
      max-width: 340px;
      text-align: left;
    }
    .row {
      /* about 的行：两端对齐（shared 默认 gap 布局，此处覆盖） */
      justify-content: space-between;
      padding: 7px 0;
      margin-bottom: 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .row:last-child { border-bottom: none; }
    .row .value { text-align: right; word-break: break-all; }
    .badge { margin-left: 6px; font-size: 10px; padding: 1px 8px; } /* 行内徽章（shared 提供配色） */
    .btn-row { max-width: 340px; }
    .footer { font-size: 11px; color: var(--text-quaternary); margin-top: 16px; line-height: 1.7; }
  </style>
</head>
<body>
  <img class="logo" id="logo" alt="" />
  <h1>DSH-Desktop</h1>
  <div class="version-tag" id="app-version">v-</div>

  <div class="card">
    <div class="row"><span class="label">DSH 运行时</span><span class="value" id="dsh-ver">-</span></div>
    <div class="row"><span class="label">DSH 最新</span><span class="value" id="dsh-latest">-</span></div>
    <div class="row">
      <span class="label">DSH-Desktop 最新</span>
      <span class="value" id="shell-latest">-<span class="badge update" id="shell-newer-badge" style="display:none">可更新</span></span>
    </div>
    <div class="row"><span class="label">服务地址</span><span class="value" id="service-url">-</span></div>
  </div>

  <div class="btn-row">
    <button class="btn" id="check-update-btn">检查更新</button>
    <a class="btn ghost" id="home-btn" href="#">项目主页</a>
  </div>

  <div class="footer">
    DeepSeek Harness Web GUI 的桌面套壳，基于 Electron<br />
    DSH 由 npm 按配置版本提供 · © 2026 zx(xwj)
  </div>

  <script src="about.js"></script>
</body>
</html>
