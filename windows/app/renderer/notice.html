<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; style-src 'self' file: 'unsafe-inline'; script-src 'self' file:; img-src 'self' file: data:" />
  <title>公告</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    body {
      /* v0.8.8（T5）同款：body 固定高度 flex 列，让 .list 的 flex:1 生效（列表独立滚动） */
      align-items: stretch;
      padding: 20px;
      height: 100vh;
      overflow: hidden;
    }
    h1 { font-size: 18px; font-weight: 590; margin-bottom: 4px; }
    .subtitle { font-size: 12px; color: var(--text-quaternary); margin-bottom: 16px; }
    .list { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; flex: 1; }
    .notice-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-standard);
      border-radius: var(--radius-card);
      padding: 14px 16px;
    }
    .notice-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .notice-title { font-size: 14px; font-weight: 590; color: var(--text-primary); }
    .notice-date { font-size: 12px; color: var(--text-quaternary); }
    .notice-content {
      font-size: 12.5px; line-height: 1.65; color: var(--text-secondary);
      white-space: pre-wrap; word-break: break-word;
    }
    .empty { color: var(--text-quaternary); text-align: center; padding: 40px 0; font-size: 13px; }
    /* v0.9.7：最新公告全文横幅（菜单栏公告条只显示截断概要，这里看全） */
    .marquee-card {
      background: var(--bg-surface);
      border: 1px solid rgba(94,106,210,0.45);
      border-radius: var(--radius-card);
      padding: 12px 16px;
      margin-bottom: 14px;
      font-size: 13px; line-height: 1.6; color: var(--text-primary);
      white-space: pre-wrap; word-break: break-word;
    }
    .marquee-card .marquee-label {
      display: inline-block; font-size: 11px; font-weight: 590;
      color: var(--brand); border: 1px solid rgba(94,106,210,0.45);
      border-radius: 4px; padding: 1px 6px; margin-right: 8px; vertical-align: 1px;
    }
  </style>
</head>
<body>
  <h1>📢 公告</h1>
  <div class="subtitle">DSH-Desktop 项目公告（发布通知 / 紧急提醒 / 活动宣传）</div>
  <div class="marquee-card" id="marquee" hidden></div>
  <div class="list" id="list"><!-- JS 渲染 --></div>

  <script src="notice.js"></script>
</body>
</html>
