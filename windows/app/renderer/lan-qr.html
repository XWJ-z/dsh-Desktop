<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; style-src 'self' file: 'unsafe-inline'; script-src 'self' file:; img-src 'self' file: data:" />
  <title>手机访问</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    body { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
    h1 { font-size: 17px; font-weight: 600; margin-bottom: 0px; }
    .subtitle { font-size: 12px; color: var(--text-quaternary); line-height: 1.7; }

    /* ── 药丸开关（开/关手机访问）── */
    .switch-row { display: flex; align-items: center; gap: 10px; }
    .switch-label { font-size: 13px; font-weight: 590; }
    .switch-state { font-size: 12px; color: var(--text-quaternary); }
    .pill {
      position: relative; width: 60px; height: 32px; flex-shrink: 0; cursor: pointer;
    }
    .pill input { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
    .pill-track {
      position: absolute; inset: 0; border-radius: 16px; background: #5b6474; transition: background .18s ease;
    }
    .pill-knob {
      position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); transition: transform .18s ease;
    }
    .pill input:checked ~ .pill-track { background: #2f9e6e; }
    .pill input:checked ~ .pill-knob { transform: translateX(28px); }

    .qr-box { display: flex; flex-direction: column; gap: 8px; }
    .qrcode { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0; }
    .qrcode img { width: 190px; height: 190px; border-radius: 8px; background: #fff; padding: 6px; object-fit: contain; }
    .qrcode .url { font-family: Consolas, "Courier New", "Microsoft YaHei", monospace; font-size: 12px; color: var(--text-primary); user-select: text; }
    .hint { font-size: 12px; color: var(--text-secondary); line-height: 1.7; }
    .warn { font-size: 12px; color: #e5484d; font-weight: 590; line-height: 1.7; background: rgba(229,72,77,.08); border: 1px solid rgba(229,72,77,.35); border-radius: var(--radius-btn); padding: 8px 10px; }
    .firewall { font-size: 12px; color: var(--warn); line-height: 1.7; background: rgba(245,166,35,.08); border: 1px solid rgba(245,166,35,.3); border-radius: var(--radius-btn); padding: 8px 10px; }
    .empty { font-size: 12px; color: var(--text-quaternary); text-align: center; padding: 12px 0; }
  </style>
</head>
<body>
  <h1>📱 手机访问</h1>
  <div class="subtitle">让手机与电脑连同一 WiFi，扫码或用浏览器打开地址即可使用 DSH。</div>

  <div class="switch-row">
    <label class="pill" title="开启/关闭手机访问">
      <input type="checkbox" id="lan-switch" />
      <span class="pill-track"></span>
      <span class="pill-knob"></span>
    </label>
    <span class="switch-label">手机访问</span>
    <span class="switch-state" id="switch-state"></span>
  </div>

  <div id="qr-box" class="qr-box"></div>

  <div class="firewall" id="firewall" hidden>
    首次使用如无法访问：在 Windows 防火墙放行 DSH-Desktop（或允许 Node/Electron 访问专用网络），并确保手机与电脑在同一 WiFi。
  </div>

  <div class="warn">⚠️ 仅限信任 WiFi 使用 —— 手机访问会让同一网络内的设备都能连到你的 DSH。</div>

  <script src="lan-qr.js"></script>
</body>
</html>
