<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; style-src 'unsafe-inline'; script-src 'self' file:; img-src 'self' file: data:" />
  <title>检查更新</title>
  <style>
    :root {
      color-scheme: dark;
      /* Linear 设计 token */
      --bg-deep: #08090a;
      --bg-panel: #0f1011;
      --bg-surface: #191a1b;
      --bg-hover: #28282c;
      --text-primary: #f7f8f8;
      --text-secondary: #d0d6e0;
      --text-tertiary: #8a8f98;
      --text-quaternary: #62666d;
      --brand: #5e6ad2;
      --accent: #7170ff;
      --accent-hover: #828fff;
      --success: #10b981;
      --warn: #f5a623;
      --border-subtle: rgba(255,255,255,0.05);
      --border-standard: rgba(255,255,255,0.08);
      --radius-btn: 6px;
      --radius-card: 8px;
      --radius-panel: 12px;
      --font: 'Inter', 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background:
        radial-gradient(800px 400px at 50% -15%, rgba(94,106,210,0.12) 0%, transparent 60%),
        var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      user-select: none;
    }
    .header { width: 100%; display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .header h1 { font-size: 20px; font-weight: 590; letter-spacing: -0.24px; }
    .refresh {
      font-size: 13px; color: var(--text-tertiary); cursor: pointer; padding: 6px 14px;
      border: 1px solid var(--border-standard); border-radius: var(--radius-btn);
      background: var(--bg-surface);
    }
    .refresh:hover { color: var(--text-primary); border-color: rgba(255,255,255,0.16); }
    .card {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-standard);
      border-radius: var(--radius-panel);
      padding: 20px;
      margin-bottom: 16px;
    }
    .card-title { font-size: 15px; font-weight: 590; margin-bottom: 14px; color: var(--text-primary); }
    .row { display: flex; align-items: center; gap: 10px; font-size: 14px; margin-bottom: 8px; flex-wrap: wrap; }
    .row .label { color: var(--text-tertiary); width: 64px; flex-shrink: 0; }
    .row .value { color: var(--text-secondary); font-weight: 500; }
    .badge { font-size: 11px; padding: 2px 10px; border-radius: 999px; font-weight: 600; }
    .badge.latest  { color: var(--success); background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3); }
    .badge.update  { color: var(--accent); background: rgba(113,112,255,0.12); border: 1px solid rgba(113,112,255,0.35); }
    .badge.unknown { color: var(--text-quaternary); background: rgba(255,255,255,0.04); border: 1px solid var(--border-subtle); }
    .notes {
      font-size: 13px; color: var(--text-tertiary); line-height: 1.6;
      background: rgba(255,255,255,0.02); border-radius: var(--radius-card);
      padding: 10px 12px; margin: 8px 0 12px;
      white-space: pre-wrap; word-break: break-all;
      max-height: 96px; overflow-y: auto;
    }
    /* v0.6.0（T-026）：更新日志小标题，视觉分组（如「v0.6.0 更新内容」） */
    .notes-title {
      font-size: 12.5px; color: var(--text-quaternary); font-weight: 600;
      margin: 10px 0 6px;
    }
    .progress-wrap { margin: 10px 0 12px; }
    .progress-bar {
      height: 6px; border-radius: 999px;
      background: rgba(255,255,255,0.06);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%; width: 0%; border-radius: 999px;
      background: var(--brand);
      transition: width .15s ease;
    }
    .progress-fill.indeterminate { animation: slide 1.2s ease-in-out infinite; }
    @keyframes slide { 0% { width: 10%; } 50% { width: 60%; } 100% { width: 10%; } }
    .progress-text { font-size: 12px; color: var(--text-tertiary); margin-top: 4px; text-align: right; }
    .btn-row { display: flex; gap: 10px; margin-top: 4px; }
    .btn {
      flex: 1; padding: 10px 0; border-radius: var(--radius-btn); font-size: 14px; font-weight: 590;
      cursor: pointer; border: none; text-align: center;
      background: var(--brand); color: #fff;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.ghost {
      background: rgba(255,255,255,0.02); color: var(--text-tertiary);
      border: 1px solid var(--border-standard);
    }
    .btn.ghost:hover { color: var(--text-primary); border-color: rgba(255,255,255,0.16); }
    .status { font-size: 12px; color: var(--text-quaternary); text-align: center; margin-top: 4px; }
    .spinner {
      width: 14px; height: 14px; display: inline-block; vertical-align: -2px;
      border: 2px solid rgba(255,255,255,0.15); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <h1>检查更新</h1>
    <div class="refresh" id="refresh">刷新</div>
  </div>

  <!-- DSH 卡片 -->
  <div class="card">
    <div class="card-title">DeepSeek Harness（DSH）</div>
    <div class="row"><span class="label">当前版本</span><span class="value" id="dsh-current">-</span></div>
    <div class="row">
      <span class="label">最新版本</span><span class="value" id="dsh-latest">-</span>
      <span class="badge unknown" id="dsh-badge">未知</span>
    </div>
    <div class="notes" id="dsh-notes" style="display:none"></div>
    <div class="btn-row">
      <button class="btn" id="dsh-upgrade" style="display:none">立即升级</button>
    </div>
    <div class="status" id="dsh-status"></div>
  </div>

  <!-- 桌面端卡片 -->
  <div class="card">
    <div class="card-title">DSH-Desktop（桌面端）</div>
    <div class="row"><span class="label">当前版本</span><span class="value" id="shell-current">-</span></div>
    <div class="row">
      <span class="label">最新版本</span><span class="value" id="shell-latest">-</span>
      <span class="badge unknown" id="shell-badge">未知</span>
    </div>
    <div class="notes-title" id="shell-notes-title" style="display:none"></div>
    <div class="notes" id="shell-notes" style="display:none"></div>
    <div class="progress-wrap" id="shell-progress" style="display:none">
      <div class="progress-bar"><div class="progress-fill" id="shell-progress-fill"></div></div>
      <div class="progress-text" id="shell-progress-text">0%</div>
    </div>
    <div class="btn-row">
      <button class="btn" id="shell-download" style="display:none">下载更新</button>
    </div>
    <div class="status" id="shell-status"></div>
  </div>

  <script src="update.js"></script>
</body>
</html>
