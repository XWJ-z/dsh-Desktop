<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>备份数据</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    /* v0.8.23（用户要求：弹窗窗口统一外观）：接入 shared.css 深色主题，
       与其他弹窗（更新/联系/关于/公告/提示词库）保持一致；保持极简布局 */
    body {
      justify-content: flex-start;
      padding: 14px 16px;
    }
    #text {
      width: 100%;
      margin-bottom: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-secondary);
      font-size: 13px;
    }
    progress {
      width: 100%;
      height: 16px;
      accent-color: var(--brand);
    }
  </style>
</head>
<body>
  <div id="text">正在准备备份…</div>
  <progress id="bar" max="100" value="0"></progress>
</body>
</html>
