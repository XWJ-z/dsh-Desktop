<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; style-src 'self' file: 'unsafe-inline'; script-src 'self' file:; img-src 'self' file: data:" />
    <title>插件市场</title>
    <!-- v1.1.1（老大反馈：插件市场没适配深色模式）：接入 shared.css ——
         主题 token（深色默认 + prefers-color-scheme: light 浅色），
         与提示词库/公告等弹窗一致跟随外观设置（nativeTheme → media query） -->
    <link rel="stylesheet" href="shared.css" />
    <style>
      /* shared.css 已提供 body 基础（flex 列 + 主题背景）；此处覆盖为全屏布局 */
      body {
        align-items: stretch;
        padding: 0;
        height: 100vh;
        overflow: hidden;
      }
      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        text-align: center;
        flex-shrink: 0;
      }
      .header h1 {
        font-size: 24px;
        margin-bottom: 10px;
      }
      .search-box {
        display: flex;
        max-width: 500px;
        margin: 0 auto;
      }
      .search-box input {
        flex: 1;
        padding: 10px 15px;
        border: none;
        border-radius: 5px 0 0 5px;
        font-size: 14px;
        background: var(--bg-input, #fff);
        color: var(--text-primary);
      }
      .search-box input::placeholder {
        color: var(--text-quaternary);
      }
      .search-box button {
        padding: 10px 20px;
        background: var(--success);
        color: white;
        border: none;
        border-radius: 0 5px 5px 0;
        cursor: pointer;
      }
      .search-box button:hover {
        filter: brightness(1.08);
      }
      /* v1.1.1 二轮（老大确认）：手动刷新按钮 —— 半透明白，与绿色搜索区分 */
      .search-box button#refreshBtn {
        background: rgba(255, 255, 255, 0.22);
        margin-left: 6px;
        border-radius: 5px;
      }
      .search-box button#refreshBtn:hover {
        background: rgba(255, 255, 255, 0.34);
      }
      .search-box button#refreshBtn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .main-container {
        display: flex;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      .sidebar {
        width: 200px;
        background: var(--bg-surface);
        border-right: 1px solid var(--border-standard);
        overflow-y: auto;
        flex-shrink: 0;
      }
      .sidebar h3 {
        padding: 15px;
        background: var(--bg-hover);
        border-bottom: 1px solid var(--border-standard);
        color: var(--text-primary);
        font-size: 14px;
      }
      .category-list {
        list-style: none;
      }
      .category-item {
        padding: 12px 15px;
        cursor: pointer;
        border-bottom: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
        color: var(--text-secondary);
        font-size: 13px;
      }
      .category-item:hover {
        background: var(--bg-hover);
        color: var(--text-primary);
      }
      .category-item.active {
        background: rgba(33, 150, 243, 0.15);
        border-left: 3px solid #2196f3;
        color: var(--text-primary);
        font-weight: 600;
      }
      .content {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        min-width: 0;
      }
      .plugin-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
      }
      .plugin-card {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-card);
        padding: 20px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.25);
        transition: transform 0.2s;
      }
      .plugin-card:hover {
        transform: translateY(-2px);
        border-color: rgba(94, 106, 210, 0.45);
      }
      .plugin-name {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 10px;
        color: var(--text-primary);
      }
      .plugin-description {
        color: var(--text-tertiary);
        margin-bottom: 15px;
        line-height: 1.5;
      }
      .plugin-category {
        display: inline-block;
        background: rgba(33, 150, 243, 0.12);
        color: var(--accent);
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        margin-bottom: 10px;
      }
      .plugin-actions {
        display: flex;
        gap: 10px;
      }
      .btn {
        padding: 8px 15px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 13px;
        transition: background 0.2s;
      }
      .btn-primary {
        background: #2196f3;
        color: white;
      }
      .btn-primary:hover {
        background: #1976d2;
      }
      .btn-secondary {
        background: var(--bg-hover);
        color: var(--text-secondary);
        border: 1px solid var(--border-standard);
      }
      .btn-secondary:hover {
        color: var(--text-primary);
        border-color: rgba(94, 106, 210, 0.45);
      }
      .security-warning {
        /* v1.1.1：红色醒目 + 置顶 + 单行（老大指令，⚠️ 保留） */
        background: #fdecea;
        border: 2px solid #e53935;
        border-radius: 8px;
        padding: 10px 16px;
        margin: 10px 20px 0;
        text-align: center;
        color: #d32f2f;
        font-size: 13.5px;
        font-weight: 600;
        flex-shrink: 0;
      }
      @media (prefers-color-scheme: dark) {
        /* v1.1.1：深色模式下红色警示改为暗红底 + 亮红字（保持醒目不刺眼） */
        .security-warning {
          background: rgba(229, 57, 53, 0.16);
          border-color: #e53935;
          color: #ff8a80;
        }
      }
      .empty-state {
        text-align: center;
        padding: 50px;
        color: var(--text-quaternary);
      }
      .loading {
        text-align: center;
        padding: 50px;
        color: var(--text-tertiary);
      }
      .banner {
        display: none;
        padding: 8px 16px;
        background: var(--success);
        color: white;
        text-align: center;
        font-size: 13px;
        flex-shrink: 0;
      }
      /* v1.1.1：免责声明确认模态框（复制安装命令前必须确认） */
      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: 9999;
        align-items: center;
        justify-content: center;
      }
      .modal-box {
        background: var(--bg-surface);
        border: 1px solid var(--border-standard);
        border-radius: 10px;
        padding: 24px 28px;
        max-width: 440px;
        width: 90%;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        text-align: center;
        max-height: 88vh;
        overflow-y: auto;
      }
      .modal-box h3 {
        color: #c62828;
        font-size: 17px;
        margin-bottom: 12px;
      }
      @media (prefers-color-scheme: dark) {
        .modal-box h3 {
          color: #ff8a80;
        }
      }
      /* v1.1.1（26 方案八）：安装须知（人话版）+ 群号兜底 */
      .modal-notices {
        text-align: left;
        background: var(--bg-input, #f5f5f5);
        border: 1px solid var(--border-subtle);
        border-radius: 8px;
        padding: 12px 14px;
        margin-bottom: 12px;
      }
      .modal-notices p {
        color: var(--text-secondary);
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .modal-notices ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .modal-notices li {
        color: var(--text-secondary);
        font-size: 13px;
        line-height: 1.8;
      }
      .modal-notices li::before {
        content: '▸ ';
        color: var(--accent);
      }
      /* v1.1.1 二轮（老大反馈）：免责声明红色加粗 */
      .modal-box .modal-disclaimer {
        color: #c62828;
        font-size: 13.5px;
        font-weight: 700;
        line-height: 1.7;
        margin-bottom: 12px;
      }
      @media (prefers-color-scheme: dark) {
        .modal-box .modal-disclaimer {
          color: #ff8a80;
        }
      }
      .modal-box .modal-cmd {
        background: var(--bg-input, #f5f5f5);
        border-radius: 6px;
        padding: 8px 10px;
        font-size: 12.5px;
        word-break: break-all;
        color: var(--text-secondary);
      }
      .modal-box .modal-cmd code {
        color: var(--accent);
        font-weight: 600;
      }
      .modal-btns {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 16px;
      }
      .modal-btns .btn {
        min-width: 110px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>插件市场</h1>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索插件..." />
        <button id="searchBtn">搜索</button>
        <!-- v1.1.1 二轮（老大确认）：手动刷新 —— 列表 7 天缓存自动刷新，想立刻看最新点一下 -->
        <button id="refreshBtn" title="立即刷新插件列表（绕过 7 天缓存）">刷新</button>
      </div>
    </div>

    <div id="banner" class="banner"></div>

    <!-- v1.1.1（老大指令）：安全提示置顶 + 红色醒目 + 单行 + 保留 ⚠️ -->
    <div class="security-warning" id="securityWarning">⚠️ 安全提示：插件来自第三方社区，安装前请查看源码，了解其功能和权限</div>

    <div class="main-container">
      <div class="sidebar">
        <h3>分类</h3>
        <ul class="category-list" id="categoryList">
          <li class="category-item active" data-category="all">
            全部
          </li>
        </ul>
      </div>

      <div class="content">
        <div id="pluginContainer">
          <div class="loading">加载中...</div>
        </div>
      </div>
    </div>

    <!-- v1.1.1：免责声明确认模态框（复制安装命令前必须确认）
         v1.1.1（26 方案八）：内嵌 4 条安装须知（人话版）+ QQ 群兜底 -->
    <div class="modal-overlay" id="confirm-modal">
      <div class="modal-box">
        <h3>安装确认</h3>
        <div class="modal-notices">
          <p>安装前须知：</p>
          <ul>
            <li>插件是别人写的程序，会在你电脑上运行</li>
            <li>它可能读取你的文件、使用你的账号、联网</li>
            <li>只装你信任的、看过源码的插件</li>
            <li>不放心 → Q 群 916607090 问一句再装</li>
          </ul>
        </div>
        <p class="modal-disclaimer">请确认插件安全，如造成任何安全问题，<strong>后果自负</strong>。</p>
        <div class="modal-cmd">命令：<code id="confirm-cmd"></code></div>
        <div class="modal-btns">
          <button class="btn btn-primary" id="confirm-ok">我已确认，复制</button>
          <button class="btn btn-secondary" id="confirm-cancel">取消</button>
        </div>
      </div>
    </div>

    <script src="plugin-market.js"></script>
  </body>
</html>
