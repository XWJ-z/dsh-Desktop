<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; style-src 'self' file: 'unsafe-inline'; script-src 'self' file:; img-src 'self' file: data:" />
    <title>插件市场</title>
    <!-- v1.1.5（UI 协调）：统一接入 shared.css —— 去掉渐变/硬编码蓝，
         全站锁定靛紫品牌 token，与其他弹窗（提示词库/公告/更新）同一设计语言 -->
    <link rel="stylesheet" href="shared.css" />
    <style>
      /* shared.css 提供主题 token + body 基础；此处覆盖为全屏布局 */
      body {
        align-items: stretch;
        padding: 0;
        height: 100vh;
        overflow: hidden;
      }
      /* 头部：干净 surface + hairline 底边，取代旧渐变头 */
      .header {
        background: var(--bg-surface);
        border-bottom: 1px solid var(--border-standard);
        padding: 18px 22px 16px;
        text-align: center;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .header h1 {
        font-size: 18px;
        font-weight: 640;
        letter-spacing: -0.3px;
        color: var(--text-primary);
        margin: 0;
      }
      .search-box {
        display: flex;
        max-width: 520px;
        margin: 0 auto;
        width: 100%;
      }
      .search-box input {
        flex: 1;
        padding: 9px 14px;
        border: 1px solid var(--border-standard);
        border-radius: var(--radius-btn) 0 0 var(--radius-btn);
        font-size: 13px;
        background: var(--bg-input);
        color: var(--text-primary);
        outline: none;
      }
      .search-box input:focus { border-color: var(--ring-focus); }
      .search-box input::placeholder { color: var(--text-quaternary); }
      .search-box button {
        padding: 9px 20px;
        background: var(--brand);
        color: #fff;
        border: none;
        border-radius: 0 var(--radius-btn) var(--radius-btn) 0;
        cursor: pointer;
        font-size: 13px;
        font-weight: 590;
        transition: background .12s ease;
        flex-shrink: 0;
      }
      .search-box button:hover { background: var(--accent-hover); }
      /* v1.1.1 二轮：手动刷新按钮 —— ghost 风格，与品牌搜索区分 */
      .search-box button#refreshBtn {
        background: var(--bg-hover);
        color: var(--text-secondary);
        border: 1px solid var(--border-standard);
        border-radius: var(--radius-btn);
        margin-left: 8px;
        padding: 9px 14px;
      }
      .search-box button#refreshBtn:hover { color: var(--text-primary); border-color: var(--border-strong); }
      .search-box button#refreshBtn:disabled { opacity: 0.55; cursor: not-allowed; }
      .main-container {
        display: flex;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      .sidebar {
        width: 204px;
        background: var(--bg-panel);
        border-right: 1px solid var(--border-standard);
        overflow-y: auto;
        flex-shrink: 0;
      }
      .sidebar h3 {
        padding: 14px 16px;
        background: transparent;
        border-bottom: 1px solid var(--border-standard);
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 620;
        letter-spacing: 0.4px;
        text-transform: uppercase;
      }
      .category-list { list-style: none; }
      .category-item {
        padding: 11px 16px;
        cursor: pointer;
        border: none;
        border-left: 3px solid transparent;
        background: transparent;
        display: flex;
        align-items: center;
        color: var(--text-secondary);
        font-size: 13px;
        transition: background .12s ease, color .12s ease, border-color .12s ease;
      }
      .category-item:hover { background: var(--bg-hover); color: var(--text-primary); }
      .category-item.active {
        background: rgba(94,106,210,0.10);
        border-left-color: var(--brand);
        color: var(--text-primary);
        font-weight: 620;
      }
      .content {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        min-width: 0;
      }
      .plugin-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 16px;
      }
      .plugin-card {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-card);
        padding: 18px;
        box-shadow: var(--shadow-card);
        transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
        display: flex; flex-direction: column; gap: 10px;
      }
      .plugin-card:hover {
        transform: translateY(-2px);
        border-color: rgba(94,106,210,0.45);
        box-shadow: var(--shadow-pop);
      }
      .plugin-name {
        font-size: 15px;
        font-weight: 640;
        letter-spacing: -0.2px;
        color: var(--text-primary);
      }
      .plugin-description {
        color: var(--text-tertiary);
        line-height: 1.55;
        font-size: 13px;
        flex: 1;
      }
      .plugin-category {
        display: inline-flex;
        align-items: center;
        align-self: flex-start;
        background: rgba(94,106,210,0.12);
        color: var(--brand);
        padding: 3px 9px;
        border-radius: 999px;
        font-size: 11.5px;
        font-weight: 590;
      }
      .plugin-actions { display: flex; gap: 8px; }
      .btn {
        padding: 8px 14px;
        border: none;
        border-radius: var(--radius-btn);
        cursor: pointer;
        font-size: 13px;
        font-weight: 590;
        flex: 1;
        transition: background .12s ease, border-color .12s ease, color .12s ease;
      }
      .btn-primary { background: var(--brand); color: #fff; }
      .btn-primary:hover { background: var(--accent-hover); }
      .btn-secondary {
        background: var(--bg-hover);
        color: var(--text-secondary);
        border: 1px solid var(--border-standard);
      }
      .btn-secondary:hover { color: var(--text-primary); border-color: var(--border-strong); }
      /* v1.1.1：红色醒目 + 置顶 + 单行（老大指令，⚠️ 保留）—— theme-aware token 化 */
      .security-warning {
        background: rgba(242,85,90,0.10);
        border: 1px solid rgba(242,85,90,0.42);
        border-radius: var(--radius-card);
        padding: 10px 16px;
        margin: 12px 20px 0;
        text-align: center;
        color: var(--danger);
        font-size: 13px;
        font-weight: 640;
        flex-shrink: 0;
      }
      @media (prefers-color-scheme: dark) {
        .security-warning {
          background: rgba(242,85,90,0.14);
          border-color: rgba(242,85,90,0.5);
          color: #ff9aa0;
        }
      }
      .empty-state { text-align: center; padding: 50px; color: var(--text-quaternary); font-size: 13.5px; }
      .loading { text-align: center; padding: 50px; color: var(--text-tertiary); font-size: 13.5px; }
      .banner {
        display: none;
        padding: 8px 16px;
        background: var(--bg-surface);
        border: 1px solid var(--border-standard);
        color: var(--text-secondary);
        text-align: center;
        font-size: 13px;
        flex-shrink: 0;
        border-bottom: 1px solid var(--border-standard);
      }
      /* v1.1.1：免责声明确认模态框（复制安装命令前必须确认） */
      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 9999;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .modal-box {
        background: var(--bg-surface);
        border: 1px solid var(--border-standard);
        border-radius: var(--radius-panel);
        padding: 24px 28px;
        max-width: 440px;
        width: 100%;
        box-shadow: var(--shadow-pop);
        text-align: center;
        max-height: 88vh;
        overflow-y: auto;
      }
      .modal-box h3 {
        color: var(--danger);
        font-size: 17px;
        font-weight: 640;
        margin-bottom: 12px;
      }
      @media (prefers-color-scheme: dark) { .modal-box h3 { color: #ff9aa0; } }
      /* v1.1.1（26 方案八）：安装须知（人话版）+ 群号兜底 */
      .modal-notices {
        text-align: left;
        background: var(--bg-input);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-card);
        padding: 12px 14px;
        margin-bottom: 12px;
      }
      .modal-notices p {
        color: var(--text-secondary);
        font-size: 13px;
        font-weight: 590;
        margin-bottom: 8px;
      }
      .modal-notices ul { list-style: none; padding: 0; margin: 0; }
      .modal-notices li {
        color: var(--text-tertiary);
        font-size: 13px;
        line-height: 1.8;
      }
      .modal-notices li::before { content: '▸ '; color: var(--brand); }
      /* v1.1.1 二轮（老大反馈）：免责声明红色加粗 */
      .modal-box .modal-disclaimer {
        color: var(--danger);
        font-size: 13.5px;
        font-weight: 700;
        line-height: 1.7;
        margin-bottom: 12px;
      }
      @media (prefers-color-scheme: dark) { .modal-box .modal-disclaimer { color: #ff9aa0; } }
      .modal-box .modal-cmd {
        background: var(--bg-input);
        border-radius: var(--radius-btn);
        padding: 8px 10px;
        font-size: 12.5px;
        word-break: break-all;
        color: var(--text-secondary);
        font-family: var(--font-mono);
      }
      .modal-box .modal-cmd code { color: var(--accent); font-weight: 600; }
      .modal-btns { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
      .modal-btns .btn { min-width: 110px; }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>插件市场</h1>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索插件..." />
        <button id="searchBtn">搜索</button>
        <!-- v1.1.1 二轮（老大确认）：手动刷新 —— 列表 7 天缓存自动刷新，想立刻看最新点一下 -->
        <button id="refreshBtn" title="立即刷新插件列表（绕过 7 天缓存）">刷新</button>
      </div>
    </div>

    <div id="banner" class="banner"></div>

    <!-- v1.1.1（老大指令）：安全提示置顶 + 红色醒目 + 单行 + 保留 ⚠️ -->
    <div class="security-warning" id="securityWarning">⚠️ 安全提示：插件来自第三方社区，安装前请查看源码，了解其功能和权限</div>

    <div class="main-container">
      <div class="sidebar">
        <h3>分类</h3>
        <ul class="category-list" id="categoryList">
          <li class="category-item active" data-category="all">
            全部
          </li>
        </ul>
      </div>

      <div class="content">
        <div id="pluginContainer">
          <div class="loading">加载中...</div>
        </div>
      </div>
    </div>

    <!-- v1.1.1：免责声明确认模态框（复制安装命令前必须确认）
         v1.1.1（26 方案八）：内嵌 4 条安装须知（人话版）+ QQ 群兜底 -->
    <div class="modal-overlay" id="confirm-modal">
      <div class="modal-box">
        <h3>安装确认</h3>
        <div class="modal-notices">
          <p>安装前须知：</p>
          <ul>
            <li>插件是别人写的程序，会在你电脑上运行</li>
            <li>它可能读取你的文件、使用你的账号、联网</li>
            <li>只装你信任的、看过源码的插件</li>
            <li>不放心 → Q 群 916607090 问一句再装</li>
          </ul>
        </div>
        <p class="modal-disclaimer">请确认插件安全，如造成任何安全问题，<strong>后果自负</strong>。</p>
        <div class="modal-cmd">命令：<code id="confirm-cmd"></code></div>
        <div class="modal-btns">
          <button class="btn btn-primary" id="confirm-ok">我已确认，复制</button>
          <button class="btn btn-secondary" id="confirm-cancel">取消</button>
        </div>
      </div>
    </div>

    <script src="plugin-market.js"></script>
  </body>
</html>
