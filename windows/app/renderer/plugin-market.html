<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; style-src 'self' file: 'unsafe-inline'; script-src 'self' file:; img-src 'self' file: data:" />
    <title>插件库</title>
    <!-- v1.1.6（UI 协调）：统一接入 shared.css —— 去掉渐变/硬编码蓝，
         全站锁定靛紫品牌 token，与其他弹窗（提示词库/公告/更新）同一设计语言 -->
    <link rel="stylesheet" href="shared.css" />
    <style>
      /* shared.css 提供主题 token + body 基础；此处覆盖为全屏布局 */
      body {
        align-items: stretch;
        padding: 0;
        height: 100vh;
        overflow: hidden;
      }
      .header {
        background: var(--bg-surface);
        background: color-mix(in srgb, var(--bg-surface) 78%, transparent);
        backdrop-filter: blur(16px) saturate(1.3);
        -webkit-backdrop-filter: blur(16px) saturate(1.3);
        border-bottom: 1px solid var(--border-standard);
        padding: 16px 22px 14px;
        text-align: center;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
        position: relative;
      }
      .header::after {
        content: '';
        position: absolute;
        left: 0; right: 0; bottom: -1px;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent) 50%, transparent);
      }
      .header h1 { font-size: 19px; font-weight: 730; letter-spacing: -0.4px; color: var(--text-primary); margin: 0; }
      /* v1.2.6：插件库 三块（已装 / 自建 / 市场）Tab */
      .tabs { display: flex; gap: 6px; max-width: 520px; margin: 0 auto; width: 100%; background: var(--bg-hover); padding: 4px; border-radius: var(--radius-btn); }
      .tabs .tab { flex: 1; padding: 8px 12px; border: none; border-radius: calc(var(--radius-btn) - 2px); background: transparent; cursor: pointer; font-size: 13px; font-weight: 590; color: var(--text-secondary); transition: background .15s, color .15s; }
      .tabs .tab:hover { color: var(--text-primary); }
      .tabs .tab.active { background: var(--bg-surface); color: var(--text-primary); box-shadow: 0 1px 4px rgba(0,0,0,.15); }
      .panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .panel[hidden] { display: none; }
      .banner { display: none; padding: 8px 16px; color: var(--text-secondary); text-align: center; font-size: 13px; flex-shrink: 0; border-bottom: 1px solid var(--border-standard); }
      .banner2 { display: none; padding: 9px 14px; margin: 12px 20px 0; border-radius: var(--radius-btn); font-size: 13px; font-weight: 590; }
      .banner2.show { display: block; }
      .banner2.ok { color: var(--success); background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.3); }
      .banner2.fail { color: var(--warn); background: rgba(245,166,35,.1); border: 1px solid rgba(245,166,35,.3); }
      /* 已装插件 */
      .card-grid { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; min-height: 0; padding: 18px 20px; }
      .plug-card { background: var(--bg-input); border: 1px solid var(--border-standard); border-top-color: var(--border-strong); border-radius: var(--radius-card); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
      .plug-card-head { display: flex; align-items: center; gap: 8px; }
      .plug-card-name { font-size: 14px; font-weight: 600; color: var(--text-primary); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .plug-card .tag { font-size: 10.5px; color: var(--text-quaternary); background: var(--bg-hover); border-radius: 999px; padding: 1px 8px; flex-shrink: 0; }
      .plug-card-desc { font-size: 12.5px; color: var(--text-secondary); line-height: 1.6; }
      .plug-card-actions { display: flex; gap: 8px; }
      .btn.sm { padding: 6px 14px; font-size: 12.5px; }
      .btn.ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border-standard); }
      .btn.ghost:hover { background: var(--bg-hover); color: var(--text-primary); }
      .empty { font-size: 12.5px; color: var(--text-quaternary); padding: 32px 6px; text-align: center; }
      .inst-bar { display: flex; justify-content: flex-end; padding: 12px 20px 0; flex-shrink: 0; }
      /* 自建插件 */
      .create-wrap { display: flex; gap: 14px; flex: 1; min-height: 0; padding: 16px 20px 20px; }
      .create-list { width: 230px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
      .create-list-head { font-size: 12px; font-weight: 590; color: var(--text-secondary); margin: 2px 4px 0; }
      .create-item { display: flex; align-items: center; gap: 7px; padding: 9px 10px; border-radius: var(--radius-btn); cursor: pointer; background: var(--bg-input); border: 1px solid var(--border-standard); color: var(--text-secondary); }
      .create-item:hover { border-color: rgba(94,106,210,.5); }
      .create-item.active { background: linear-gradient(90deg, rgba(124,120,255,0.16), rgba(124,120,255,0.04)); border-color: rgba(124,120,255,0.55); color: var(--text-primary); }
      .create-item-name { font-size: 12.5px; font-weight: 590; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .create-item .del { width: 22px; height: 22px; border: none; background: transparent; cursor: pointer; color: var(--text-quaternary); font-size: 12px; border-radius: 6px; }
      .create-item .del:hover { color: #ff6b6b; background: rgba(255,107,107,.12); }
      .create-form { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; background: var(--bg-input); border: 1px solid var(--border-standard); border-radius: var(--radius-btn); padding: 12px 14px; overflow-y: auto; }
      .field-label { font-size: 12px; font-weight: 590; color: var(--brand); }
      .field-label .hint { font-weight: 400; color: var(--text-quaternary); margin-left: 6px; font-size: 11px; }
      .inp, textarea.inp { width: 100%; box-sizing: border-box; padding: 8px 10px; background: var(--bg-input); border: 1px solid var(--border-standard); border-radius: var(--radius-btn); color: var(--text-primary); font: 12.5px/1.6 Consolas, "Courier New", "Microsoft YaHei", monospace; outline: none; }
      .inp:focus, textarea.inp:focus { border-color: rgba(94,106,210,.55); }
      textarea.inp { resize: vertical; white-space: pre-wrap; }
      .create-actions { display: flex; gap: 8px; margin-top: 2px; }
      .create-new { padding: 8px 12px; border: 1px dashed var(--border-standard); border-radius: var(--radius-btn); background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 12.5px; font-weight: 590; }
      /* 插件市场 */
      .market-search { display: flex; gap: 8px; max-width: 520px; margin: 14px auto 0; width: 100%; padding: 0 20px; flex-shrink: 0; }
      .market-search input { flex: 1; padding: 9px 14px; border: 1px solid var(--border-standard); border-radius: var(--radius-btn) 0 0 var(--radius-btn); font-size: 13px; background: var(--bg-input); color: var(--text-primary); outline: none; }
      .market-search input:focus { border-color: var(--ring-focus); }
      .market-search button { padding: 9px 18px; background: var(--grad-primary); color: #fff; border: none; border-radius: 0 var(--radius-btn) var(--radius-btn) 0; cursor: pointer; font-size: 13px; font-weight: 660; transition: background .12s ease, box-shadow .14s ease; flex-shrink: 0; }
      .market-search button:hover { background: var(--grad-primary-hover); box-shadow: var(--shadow-glow); }
      .market-search button#refreshBtn { background: var(--bg-hover); color: var(--text-secondary); border: 1px solid var(--border-standard); border-radius: var(--radius-btn); margin-left: 8px; padding: 9px 14px; }
      .market-search button#refreshBtn:hover { color: var(--text-primary); border-color: var(--border-strong); }
      .market-search button#refreshBtn:disabled { opacity: 0.55; cursor: not-allowed; }
      .main-container { display: flex; flex: 1; min-height: 0; overflow: hidden; }
      .sidebar { width: 204px; background: var(--bg-panel); border-right: 1px solid var(--border-standard); overflow-y: auto; flex-shrink: 0; }
      .sidebar h3 { padding: 14px 16px; background: transparent; border-bottom: 1px solid var(--border-standard); color: var(--text-secondary); font-size: 12px; font-weight: 620; letter-spacing: 0.4px; text-transform: uppercase; }
      .category-list { list-style: none; }
      .category-item { padding: 11px 16px; cursor: pointer; border: none; border-left: 3px solid transparent; background: transparent; display: flex; align-items: center; color: var(--text-secondary); font-size: 13px; transition: background .12s ease, color .12s ease, border-color .12s ease; }
      .category-item:hover { background: var(--bg-hover); color: var(--text-primary); }
      .category-item:active { background: var(--bg-hover); transform: scale(0.97); }
      .category-item.active { background: linear-gradient(90deg, rgba(124,120,255,0.18), rgba(124,120,255,0.05)); border-left-color: var(--accent); color: var(--text-primary); font-weight: 650; }
      .content { flex: 1; padding: 20px; overflow-y: auto; min-width: 0; }
      .plugin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
      .plugin-card { background: var(--bg-surface); background: color-mix(in srgb, var(--bg-surface) 72%, transparent); backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3); border: 1px solid var(--border-standard); border-top-color: var(--border-strong); border-radius: var(--radius-card); padding: 18px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), var(--shadow-card); transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; display: flex; flex-direction: column; gap: 10px; }
      .plugin-card:hover { transform: translateY(-3px); border-color: rgba(124,120,255,0.42); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), var(--shadow-pop); }
      .plugin-card:active { transform: translateY(-1px) scale(0.98); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), var(--shadow-card); transition-duration: .08s; }
      .plugin-name { font-size: 15px; font-weight: 640; letter-spacing: -0.2px; color: var(--text-primary); }
      .plugin-description { color: var(--text-tertiary); line-height: 1.55; font-size: 13px; flex: 1; }
      .plugin-category { display: inline-flex; align-items: center; align-self: flex-start; background: rgba(94,106,210,0.12); color: var(--brand); padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 590; }
      .plugin-actions { display: flex; gap: 8px; }
      .btn { padding: 8px 14px; border: none; border-radius: var(--radius-btn); cursor: pointer; font-size: 13px; font-weight: 590; flex: 1; transition: background .12s ease, border-color .12s ease, color .12s ease; }
      .btn-primary { background: var(--brand); color: #fff; }
      .btn-primary:hover { background: var(--accent-hover); }
      .btn-secondary { background: var(--bg-hover); color: var(--text-secondary); border: 1px solid var(--border-standard); }
      .btn-secondary:hover { color: var(--text-primary); border-color: var(--border-strong); }
      .security-warning { background: rgba(242,85,90,0.10); border: 1px solid rgba(242,85,90,0.42); border-radius: var(--radius-card); padding: 10px 16px; margin: 12px 20px 0; text-align: center; color: var(--danger); font-size: 13px; font-weight: 640; flex-shrink: 0; }
      @media (prefers-color-scheme: dark) { .security-warning { background: rgba(242,85,90,0.14); border-color: rgba(242,85,90,0.5); color: #ff9aa0; } }
      .empty-state { text-align: center; padding: 50px; color: var(--text-quaternary); font-size: 13.5px; }
      .loading { text-align: center; padding: 50px; color: var(--text-tertiary); font-size: 13.5px; }
      .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); z-index: 9999; align-items: center; justify-content: center; padding: 16px; }
      .modal-box { background: var(--bg-surface); border: 1px solid var(--border-standard); border-radius: var(--radius-panel); padding: 24px 28px; max-width: 440px; width: 100%; box-shadow: var(--shadow-pop); text-align: center; max-height: 88vh; overflow-y: auto; }
      .modal-box h3 { color: var(--danger); font-size: 17px; font-weight: 640; margin-bottom: 12px; }
      @media (prefers-color-scheme: dark) { .modal-box h3 { color: #ff9aa0; } }
      .modal-notices { text-align: left; background: var(--bg-input); border: 1px solid var(--border-subtle); border-radius: var(--radius-card); padding: 12px 14px; margin-bottom: 12px; }
      .modal-notices p { color: var(--text-secondary); font-size: 13px; font-weight: 590; margin-bottom: 8px; }
      .modal-notices ul { list-style: none; padding: 0; margin: 0; }
      .modal-notices li { color: var(--text-tertiary); font-size: 13px; line-height: 1.8; }
      .modal-notices li::before { content: '▸ '; color: var(--brand); }
      .modal-box .modal-disclaimer { color: var(--danger); font-size: 13.5px; font-weight: 700; line-height: 1.7; margin-bottom: 12px; }
      @media (prefers-color-scheme: dark) { .modal-box .modal-disclaimer { color: #ff9aa0; } }
      .modal-box .modal-cmd { background: var(--bg-input); border-radius: var(--radius-btn); padding: 8px 10px; font-size: 12.5px; word-break: break-all; color: var(--text-secondary); font-family: var(--font-mono); }
      .modal-box .modal-cmd code { color: var(--accent); font-weight: 600; }
      .modal-btns { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
      .modal-btns .btn { min-width: 110px; }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>插件库</h1>
      <div class="tabs">
        <button class="tab active" data-tab="installed">📦 已装插件</button>
        <button class="tab" data-tab="create">✏️ 自建插件</button>
        <button class="tab" data-tab="market">🌐 插件市场</button>
      </div>
    </div>

    <div id="banner" class="banner"></div>

    <!-- 📦 已装插件（v1.2.6：dsh plugin list） -->
    <div id="panel-installed" class="panel">
      <div id="inst-banner" class="banner2"></div>
      <div class="inst-bar"><button id="inst-refresh" class="btn btn-secondary" style="flex:0 0 auto;">刷新</button></div>
      <div id="inst-list" class="card-grid"></div>
    </div>

    <!-- ✏️ 自建插件（纯文本封装，无代码执行） -->
    <div id="panel-create" class="panel" hidden>
      <div id="create-banner" class="banner2"></div>
      <div class="create-wrap">
        <div class="create-list">
          <div class="create-list-head">我的插件</div>
          <div id="create-items" style="display:flex;flex-direction:column;gap:6px;"></div>
          <button id="create-new" class="create-new">＋ 新建插件</button>
        </div>
        <div class="create-form">
          <div class="field-label">插件名称 <span class="hint">用于区分/检索，如 dsh-my-tool</span></div>
          <input id="form-name" class="inp" placeholder="例如 dsh-my-tool" />
          <div class="field-label">描述 <span class="hint">一句话说明用途</span></div>
          <input id="form-desc" class="inp" placeholder="例如 增强侧边栏的某能力" />
          <div class="field-label">安装命令（可选） <span class="hint">用于复制安装提示</span></div>
          <input id="form-command" class="inp" placeholder="例如 dsh plugin --profile web add xxx" />
          <div class="field-label">说明（可选） <span class="hint">使用方式/注意事项</span></div>
          <textarea id="form-hint" class="inp" style="min-height:90px;" placeholder="使用方式、来源、注意事项…"></textarea>
          <div class="create-actions"><span style="flex:1;"></span><button id="form-save" class="btn btn-primary" style="flex:0 0 auto;padding:8px 20px;">保存插件</button></div>
        </div>
      </div>
    </div>

    <!-- 🌐 插件市场（原功能保留） -->
    <div id="panel-market" class="panel" hidden>
      <div class="security-warning" id="securityWarning">⚠️ 安全提示：插件来自第三方社区，安装前请查看源码，了解其功能和权限</div>
      <div class="market-search">
        <input type="text" id="searchInput" placeholder="搜索插件..." />
        <button id="searchBtn">搜索</button>
        <button id="refreshBtn" title="立即刷新插件列表（绕过 7 天缓存）">刷新</button>
      </div>
      <div class="main-container">
        <div class="sidebar">
          <h3>分类</h3>
          <ul class="category-list" id="categoryList">
            <li class="category-item active" data-category="all">全部</li>
          </ul>
        </div>
        <div class="content">
          <div id="pluginContainer"><div class="loading">加载中...</div></div>
        </div>
      </div>
    </div>

    <!-- 免责声明确认模态框 -->
    <div class="modal-overlay" id="confirm-modal">
      <div class="modal-box">
        <h3>安装确认</h3>
        <div class="modal-notices">
          <p>安装前须知：</p>
          <ul>
            <li>插件是别人写的程序，会在你电脑上运行</li>
            <li>它可能读取你的文件、使用你的账号、联网</li>
            <li>只装你信任的、看过源码的插件</li>
            <li>不放心 → Q 群 916607090 问一句再装</li>
          </ul>
        </div>
        <p class="modal-disclaimer">请确认插件安全，如造成任何安全问题，<strong>后果自负</strong>。</p>
        <div class="modal-cmd">命令：<code id="confirm-cmd"></code></div>
        <div class="modal-btns">
          <button class="btn btn-primary" id="confirm-ok">我已确认，复制</button>
          <button class="btn btn-secondary" id="confirm-cancel">取消</button>
        </div>
      </div>
    </div>

    <script src="plugin-market.js"></script>
  </body>
</html>
