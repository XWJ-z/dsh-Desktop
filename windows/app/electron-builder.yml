# electron-builder.yml — DSH-Desktop Windows 安装程序（NSIS）配置
#
# 本壳只提供运行环境：Electron + 内置 npm（供 npx 拉取 DSH）+ 内置 Node 运行时
# （resources/node/node.exe，真实 Node，保证 DSH 原生模块 ABI 兼容）。DSH 本体
# 不在安装包内，首次运行由壳用内置 npm 安装到用户数据目录。因此：
#   - 安装包不含 DSH 依赖树；
#   - 更新 DSH 只需改 app/config.json 的版本号，壳本身不受 DSH 版本影响。

appId: com.deepseek.dsh-desktop
productName: DSH-Desktop
copyright: "Copyright © 2026 zx(xwj)"

directories:
  output: dist/installer
  # 注意：不要将 assets 设为 buildResources——electron-builder 约定 buildResources
  # 目录不会复制进应用包（构建专用），会导致安装版缺失 icon.png/qq-group.png
  # （联系我们二维码、关于/联系窗口 logo 加载失败）。assets 由下方 files 随包分发，
  # win.icon 的 assets/icon.ico 相对 app 目录解析，不受影响。

# 打包壳本体 + 内置 Node 运行时（main/preload/renderer/assets/config/
# node_modules 生产依赖 = npm），排除 docs/scripts/缓存等开发文件。
files:
  - "**/*"
  - "!dist/**"
  - "!scripts/**"
  - "!resources/**"
  - "!.npm-cache/**"
  - "!.electron-cache/**"
  - "!.builder-cache/**"
  - "!*.log"

# 内置 Node 运行时放到 resources/node（应用包外，属运行环境而非应用代码）；
# 打包后路径：<install>/resources/node/node.exe，main.js 经 app.getAppPath()/../node 定位。
extraResources:
  - from: resources/node
    to: node
    filter:
      - "**/*"

asar: false
npmRebuild: false
nodeGypRebuild: false

# T-024 v0.6.0 安装包瘦身：Electron 运行时只保留 zh-CN/en-US 两个 locale，
# 去掉其余 53 个语言文件（原 55 个共 46.6MB，打包后约减 40MB）。
electronLanguages:
  - zh-CN
  - en-US

# T-024 v0.6.0 安装包瘦身：LZMA 最高压缩（约多 1-2 分钟构建，换 ~5MB 体积）。
# 如想加快构建可改回默认 normal（仅 electronLanguages 已能减 ~40MB）。
compression: maximum

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  # ── T-023 代码签名：Azure Trusted Signing ──────────────────────────────
  # 开通步骤见 docs/T023-Azure-Trusted-Signing-指南.md。
  # 启用方法：填好下面 azureSignOptions 各字段（取消注释），并在构建时提供
  # Entra ID 认证环境变量（electron-builder 用 Azure.Identity EnvironmentCredential）：
  #   AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET
  # 未配置本块 = 不签名（现状，构建不受影响）。
  #
  # azureSignOptions:
  #   publisherName: "zx(xwj)"                   # 必须与证书配置文件中的发行者一致
  #   endpoint: "https://eastus.trustedsigning.azure.net"  # 账户所在区域端点
  #   certificateProfileName: "你的证书配置文件名称"
  #   codeSigningAccountName: "你的 Trusted Signing 账户名"
  #   # 可选：fileDigest: "SHA256" / timestampRfc3161 / timestampDigest

nsis:
  # 向导式安装（非 oneClick），默认安装到 %LOCALAPPDATA%\Programs\DSH-Desktop
  #（perMachine: false，无需管理员权限），并允许用户更改安装目录。
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  # v0.8.13（T1 修复）：覆盖安装前自动结束旧版本运行中的实例 ——
  # 否则托盘常驻的旧进程持有单实例锁，新版本双击静默退出（"无反应"）。
  # 注：electron-builder 26.x 已移除旧版 killRunningProcesses 选项（schema 校验会失败），
  # 但其 NSIS 模板对 assisted 安装已内置等效逻辑（installSection.nsh 的 CHECK_APP_RUNNING：
  # 检测到运行中的 DSH-Desktop.exe → 弹窗确认 → 同用户 taskkill → 强制终止重试），无需配置。
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DSH-Desktop
  artifactName: DSH-Desktop-Setup-${version}.${ext}
  uninstallDisplayName: DSH-Desktop
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  multiLanguageInstaller: true
  installerLanguages:
    - zh_CN
    - en_US
